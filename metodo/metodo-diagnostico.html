<title>Diagnósticos Atom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Roboto:wght@300;400;500;700&display=swap">
<style>
/* Layout e identidade da Atom (deck Atom 2026 e diagnóstico Coalumaq): fundo branco, títulos Roboto finos com a parte final
   em negrito, etiquetas IBM Plex Mono, seções numeradas, cartões brancos com fio verde e cartão de destaque roxo,
   lascas diagonais nos cantos. Escala tipográfica do mapa: 64/48/32/24/20/18/16/14/12/10, entrelinhas 1.2 e 1.6. */
:root {
  color-scheme: light;
  --sans: Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", "Courier New", monospace;
  --fs-display: 64px; --fs-h1: 48px; --fs-h2: 32px; --fs-h3: 24px; --fs-h4: 20px;
  --fs-lead: 18px; --fs-body: 16px; --fs-small: 14px; --fs-caption: 12px; --fs-overline: 10px;
  --lh-tight: 1.2; --lh-body: 1.6;
  --roxo: #461b77; --roxo-2: #6b4aa0; --verde: #00c864; --verde-texto: #08804a;
  --tinta: #1e1e1e; --suave: #5f5a66; --fio: #e9e6ee; --fio-forte: #d6d1de; --fundo: #ffffff; --tom: #f7f6fa; --lavanda: #f1edf8;
  --ruim: #c62828; --medio: #b26a00; --bom: #08804a;
  --sombra: 0 1px 2px rgba(30, 30, 30, .06), 0 4px 16px rgba(30, 30, 30, .06);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--fundo); color: var(--tinta); font-family: var(--sans); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: clamp(34px, 4.4vw, var(--fs-h1)); line-height: 1.12; font-weight: 300; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-size: clamp(26px, 3vw, var(--fs-h2)); line-height: var(--lh-tight); font-weight: 300; text-wrap: balance; }
h1 b, h2 b { font-weight: 700; }
h3 { font-size: var(--fs-h3); line-height: var(--lh-tight); font-weight: 700; }
h4 { font-size: var(--fs-small); line-height: 1.4; font-weight: 700; }
.lead { font-size: var(--fs-body); color: var(--suave); max-width: 64ch; line-height: 1.75; }
.small { font-size: var(--fs-small); }
.cap { font-size: var(--fs-caption); color: var(--suave); }
.over { font-family: var(--mono); font-size: var(--fs-overline); font-weight: 500; text-transform: uppercase; letter-spacing: .22em; color: var(--roxo); }
.suave { color: var(--suave); }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--roxo); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; }

/* Barra superior */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--fio); }
.topo .in { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 28px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); flex-wrap: wrap; }
.topo img { height: 34px; width: auto; display: block; }
.topo nav { display: flex; gap: 26px; flex-wrap: wrap; margin-left: auto; }
.topo nav a { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--suave); text-decoration: none; padding: 4px 0; border-bottom: 2px solid transparent; }
.topo nav a:hover { color: var(--roxo); }
.topo nav a.on { color: var(--roxo); border-bottom-color: var(--verde); }

.palco { position: relative; }
.lasca { position: absolute; top: 0; right: max(16px, calc((100% - 1280px) / 2 + 16px)); width: clamp(140px, 22vw, 300px); height: auto; pointer-events: none; z-index: 0; }
@media (max-width: 760px) { .lasca { width: 110px; opacity: .9; } }
.pagina { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 56px max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px)); counter-reset: sec; }
.secao { padding-top: 64px; margin-top: 64px; border-top: 1px solid var(--fio); }
.secao:first-child { padding-top: 0; margin-top: 0; border-top: 0; }
.secao:not(:first-child) > .cab h2::before, .secao:not(:first-child) > .cab-linha h2::before { counter-increment: sec; content: counter(sec, decimal-leading-zero); font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--roxo); letter-spacing: .1em; margin-right: 18px; vertical-align: .55em; }
.cab { display: grid; gap: 14px; max-width: 820px; margin-bottom: 36px; }
.secao:first-child > .cab, .secao:first-child > .cab-linha .cab { padding-right: clamp(0px, 20vw, 300px); }
.cab-linha { display: flex; justify-content: space-between; align-items: end; gap: 16px 32px; flex-wrap: wrap; margin-bottom: 30px; }
.cab-linha .cab { margin-bottom: 0; }
.fecho { margin-top: 28px; font-weight: 700; color: var(--roxo); font-size: var(--fs-small); }

/* Abertura da visão geral */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .8fr); gap: 32px; align-items: center; }
.hero img { width: 100%; height: auto; max-height: 340px; object-fit: contain; object-position: right center; display: block; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } .hero img { max-height: 200px; } }

/* Colunas com fio no topo (modelos e metas) */
.colunas { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 28px; }
@media (max-width: 1080px) { .colunas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .colunas { grid-template-columns: 1fr; } }
.col { border-top: 2px solid var(--verde); padding-top: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col.p1 { border-top-color: var(--roxo); }
.col.verde { border-top-color: var(--verde); }
.col .linha-top { display: flex; justify-content: space-between; gap: 8px; }
.col .linha-top .cap { font-family: var(--mono); }
.col h3 { font-size: var(--fs-h3); }
.grande { font-size: clamp(40px, 5vw, var(--fs-display)); line-height: 1.05; font-weight: 500; color: var(--roxo); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.grande small { font-size: var(--fs-caption); font-weight: 700; color: var(--roxo); letter-spacing: 0; margin-left: 10px; vertical-align: .9em; }
.dl { margin: 6px 0 0; }
.dl div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--fio); font-size: var(--fs-small); }
.dl dt { color: var(--suave); }
.dl dd { margin: 0; text-align: right; }
.ir { margin-top: auto; padding: 14px 0; border-bottom: 2px solid var(--fio-forte); display: flex; justify-content: space-between; align-items: center; font-size: var(--fs-small); font-weight: 700; color: var(--roxo); text-decoration: none; }
.ir:hover { border-bottom-color: var(--roxo); }
.ponto { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-caption); color: var(--suave); }
.ponto::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--fio-forte); }
.ponto.ok::before { background: var(--verde); }
.ponto.disc::before { background: #e0a030; }

/* Cartões no padrão Coalumaq: branco com fio verde; o destaque é roxo */
.cartoes > .col, .tres > div { background: var(--fundo); border: 0; border-top: 3px solid var(--verde); box-shadow: var(--sombra); padding: 22px; }
.cartoes > .col.destaque, .tres > div.r { background: var(--roxo); color: #fff; border-top-color: var(--verde); }
.cartoes > .col.destaque .over, .tres > div.r .over { color: var(--verde); }
.cartoes > .col.destaque .suave, .cartoes > .col.destaque .cap, .tres > div.r .suave { color: #d9cfe8; }
.cartoes > .col.destaque .grande { color: #fff; }
.cartoes .grande { font-size: clamp(28px, 3.2vw, 44px); overflow-wrap: anywhere; }
.tres > div.r .setas li::before { color: var(--verde); }

/* Passos (fio verde com ponto) */
.passos { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px; }
@media (max-width: 960px) { .passos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .passos { grid-template-columns: 1fr; } }
.passos div { display: grid; gap: 6px; align-content: start; }
.passos i { display: flex; align-items: center; margin-bottom: 10px; }
.passos i::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--verde); flex: none; }
.passos i::after { content: ""; flex: 1; height: 2px; background: var(--verde); }
.passos b { font-weight: 700; font-size: var(--fs-lead); }
.passos p { font-size: var(--fs-small); color: var(--suave); }

/* Diagnóstico: navegação lateral + conteúdo */
.diag { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 48px; align-items: start; }
.diag > * { min-width: 0; }
@media (max-width: 900px) { .diag { grid-template-columns: minmax(0, 1fr); gap: 24px; } }
.subnav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); display: grid; border-top: 1px solid var(--fio); }
@media (max-width: 900px) { .subnav { position: static; grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.subnav a { display: flex; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--fio); text-decoration: none; color: var(--suave); font-size: var(--fs-small); }
.subnav a span { font-family: var(--mono); font-size: 11px; color: var(--suave); }
.subnav a:hover { color: var(--tinta); }
.subnav a.on { background: var(--lavanda); color: var(--roxo); font-weight: 700; box-shadow: inset 2px 0 0 var(--roxo); }
.subnav a.on span { color: var(--roxo); }
.trocar { display: flex; gap: 6px 26px; flex-wrap: wrap; margin-bottom: 30px; padding-right: clamp(0px, 20vw, 300px); }
.trocar a { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--suave); text-decoration: none; padding-bottom: 3px; border-bottom: 2px solid transparent; }
.trocar a.on { color: var(--roxo); border-bottom-color: var(--verde); }

/* Lista + detalhe (12 pontos, áreas) */
.mestre { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 40px; align-items: start; }
@media (max-width: 1000px) { .mestre { grid-template-columns: 1fr; } }
.lista { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--fio); }
.lista button { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--fio); padding: 13px 10px; cursor: pointer; font-size: var(--fs-small); }
.lista button:hover { background: var(--tom); }
.lista button.on { background: var(--lavanda); box-shadow: inset 0 2px 0 var(--verde); }
.lista button.on b { color: var(--roxo); }
.lista .n { font-family: var(--mono); color: var(--suave); font-size: 11px; }
.lista b { font-weight: 700; }
.lista .lado { font-size: var(--fs-caption); color: var(--suave); white-space: nowrap; }
.detalhe { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); border-top: 2px solid var(--roxo); padding-top: 22px; display: grid; gap: 18px; }
.detalhe .big-n { font-size: var(--fs-h1); font-weight: 300; color: var(--roxo); line-height: 1; font-variant-numeric: tabular-nums; }
.detalhe h3 { font-size: var(--fs-h4); }
.detalhe .bloco { display: grid; gap: 6px; padding-top: 14px; border-top: 1px solid var(--fio); }
.detalhe p { font-size: var(--fs-small); line-height: 1.75; }
.ligas { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.ligas a, .ligas span { font-size: var(--fs-small); font-weight: 700; text-decoration: none; }
.ligas a::after { content: " →"; }
.crit { margin: 0; padding: 0; list-style: none; display: grid; }
.crit li { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; padding: 8px 0; border-top: 1px solid var(--fio); font-size: var(--fs-small); }
.crit li .n { font-family: var(--mono); font-size: 11px; color: var(--suave); }
.crit li .r { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--verde-texto); }
details.filtro { border-top: 1px solid var(--fio); border-bottom: 1px solid var(--fio); padding: 16px 0; margin-bottom: 30px; }
details.filtro summary { cursor: pointer; font-weight: 700; font-size: var(--fs-small); color: var(--roxo); }
.testes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px; margin-top: 18px; }
@media (max-width: 900px) { .testes { grid-template-columns: 1fr 1fr; } }
.testes div { border-top: 2px solid var(--verde); padding-top: 10px; display: grid; gap: 4px; font-size: var(--fs-small); }
.testes b { font-weight: 700; }

/* Processo */
.proc { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--fio); }
.proc li { border-bottom: 1px solid var(--fio); }
.proc button { width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; text-align: left; background: none; border: 0; padding: 16px 10px; cursor: pointer; }
.proc button:hover { background: var(--tom); }
.proc li.on > button { background: var(--lavanda); box-shadow: inset 0 2px 0 var(--verde); }
.proc .n { font-size: var(--fs-h3); font-weight: 300; color: var(--roxo); font-variant-numeric: tabular-nums; }
.proc b { font-weight: 700; display: block; }
.proc .modo { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--suave); white-space: nowrap; }
.proc .abre { display: none; padding: 4px 10px 22px 66px; gap: 16px; }
.proc li.on .abre { display: grid; }
@media (max-width: 600px) { .proc .abre { padding-left: 10px; } }
.grade4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 24px; }
@media (max-width: 760px) { .grade4 { grid-template-columns: 1fr 1fr; } }
.grade4 div { display: grid; gap: 2px; font-size: var(--fs-small); }
.grade4 .cap { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }

/* Escopo */
.tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 900px) { .tres { grid-template-columns: 1fr; } }
.tres > div { display: grid; gap: 10px; align-content: start; }
.setas { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: var(--fs-small); }
.setas li { display: grid; grid-template-columns: 18px 1fr; }
.setas li::before { content: "→"; color: var(--verde-texto); }

/* Tabelas */
.rolar { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: var(--fs-small); }
table.t th { text-align: left; font-family: var(--mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .2em; color: var(--roxo); padding: 0 14px 10px 0; border-bottom: 1px solid var(--fio-forte); white-space: nowrap; }
table.t td { padding: 12px 14px 12px 0; border-bottom: 1px solid var(--fio); vertical-align: top; }
table.t td.r, table.t th.r { text-align: right; }
table.t tr.total td { font-weight: 700; border-bottom: 2px solid var(--roxo); color: var(--roxo); }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--tom); }
table.t input { width: 100px; padding: 6px 8px; border: 1px solid var(--fio-forte); border-radius: 4px; text-align: right; font-variant-numeric: tabular-nums; background: var(--fundo); }
.alerta { font-size: var(--fs-caption); color: var(--medio); }
.alertas { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.alertas li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; font-size: var(--fs-small); padding: 14px 16px; background: #fdf6e8; border-left: 3px solid #e0a030; }
.alertas li::before { content: "!"; font-weight: 700; color: var(--medio); }

/* Formulários */
.campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 14px 18px; }
.campo { display: grid; gap: 4px; }
.campo label { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--suave); }
.campo input, .campo select { padding: 10px 12px; border: 1px solid var(--fio-forte); border-radius: 4px; background: var(--fundo); width: 100%; font-variant-numeric: tabular-nums; }
.campo input:focus, textarea:focus, table.t input:focus { outline: none; border-color: var(--roxo); box-shadow: 0 0 0 3px var(--lavanda); }
.btn { border: 0; border-radius: 0; padding: 12px 20px; font-size: var(--fs-small); font-weight: 700; line-height: var(--lh-tight); cursor: pointer; background: var(--roxo); color: #fff; text-decoration: none; display: inline-block; }
.btn:hover { background: #3a1564; }
.btn.sec { background: transparent; color: var(--roxo); box-shadow: inset 0 0 0 1px var(--roxo); }
.btn.sec:hover { background: var(--lavanda); }
.btn[disabled] { opacity: .5; cursor: default; }
.acoes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.msg { font-size: var(--fs-caption); color: var(--suave); min-height: 1.2em; }

/* Gerar */
.gerar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 430px); gap: 48px; align-items: start; }
@media (max-width: 1120px) { .gerar { grid-template-columns: 1fr; } }
.escolhe { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .escolhe { grid-template-columns: 1fr 1fr; } }
.escolhe label { display: grid; gap: 4px; padding: 16px; border-top: 3px solid var(--fio-forte); background: var(--fundo); box-shadow: var(--sombra); cursor: pointer; }
.escolhe label.on { border-top-color: var(--verde); background: var(--roxo); color: #fff; }
.escolhe label.on span { color: #d9cfe8; }
.escolhe input { accent-color: var(--verde); margin: 0 0 4px; }
.escolhe b { font-weight: 700; }
.escolhe span { font-size: var(--fs-caption); color: var(--suave); }
.bloco-g { display: grid; gap: 16px; }
.bloco-g + .bloco-g { margin-top: 44px; }
.bloco-g > h4 { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--roxo); }
.areas-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 18px; }
.area-g { background: var(--fundo); border-top: 3px solid var(--verde); box-shadow: var(--sombra); padding: 16px 18px; display: grid; gap: 6px; align-content: start; transition: border-color .2s, background .2s; }
.area-g.urg { border-top-color: var(--ruim); }
.area-g.fora { opacity: .55; box-shadow: none; background: var(--tom); }
.area-g.luz { background: var(--lavanda); }
.area-g .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.area-g h4 { font-size: var(--fs-body); }
.area-g .nota { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--roxo); }
.area-g .u { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ruim); }
.ck { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; font-size: var(--fs-small); cursor: pointer; padding: 2px 0; }
.ck input { margin: 4px 0 0; accent-color: var(--roxo); }
.area-g textarea { width: 100%; min-height: 40px; resize: vertical; border: 1px solid var(--fio); border-radius: 4px; padding: 8px 10px; font-size: var(--fs-caption); line-height: 1.5; background: var(--tom); }
.area-g .pe { display: flex; justify-content: space-between; gap: 8px; font-size: var(--fs-caption); color: var(--suave); }
.area-g .pe label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.area-g .pe input { accent-color: var(--roxo); }
.res { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); background: var(--fundo); box-shadow: var(--sombra); border-top: 3px solid var(--verde); padding: 22px; display: grid; gap: 22px; }
.res .geral { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.res .geral .v { font-size: var(--fs-display); font-weight: 500; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--roxo); }
.res .geral .v small { font-size: var(--fs-lead); color: var(--suave); font-weight: 300; }
.res .bl { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--fio); }
.barra-l { display: grid; grid-template-columns: minmax(0, 1fr) 96px 42px; gap: 10px; align-items: center; padding: 4px 0; font-size: var(--fs-small); cursor: pointer; background: none; border: 0; width: 100%; text-align: left; }
.barra-l:hover span:first-child { color: var(--roxo); }
.barra-l .tr { height: 8px; background: var(--fio); overflow: hidden; }
.barra-l .tr i { display: block; height: 100%; transition: width .25s; }
.barra-l .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

<script>
/* ======================= UTILIDADES ======================= */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const txt = c => c.replace(/^!/, "");
const rapido = c => c.startsWith("!");
const n0 = v => Math.round(v).toLocaleString("pt-BR");
const n1 = v => v.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const brl = (v, d = 0) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: d, maximumFractionDigits: d });
const hoje = () => new Date().toISOString().slice(0, 10);
const dataBR = d => d ? d.split("-").reverse().join("/") : "";
const pad = i => String(i + 1).padStart(2, "0");
const ST = { ok: ["ok", "Definido"], disc: ["disc", "Em discussão"], adef: ["", "A definir"] };
const MODO = { auto: "Automático", parcial: "Parcial", manual: "Manual" };
const GRUPO = { mkt: "Marketing", ven: "Vendas", ges: "Gestão" };
const ORDEM = { ven: 0, ges: 1, mkt: 2 };
const tipo = id => TIPOS.find(t => t.id === id);
const pontosDe = t => PONTOS[t.pontos] || [];
const etapasDaArea = (t, a) => t.processo.map((p, i) => ({ p, i })).filter(({ p }) => Array.isArray(p.alimenta) && p.alimenta.includes(a));
const tiposComArea = a => TIPOS.filter(t => t.areas.includes(a));

/* ======================= ESTADO ======================= */
let plan = JSON.parse(JSON.stringify(PLANEJAMENTO_PADRAO));
plan.cambioEUR = plan.cambioEUR ?? 5.80; plan.precos = plan.precos || {}; plan.mensal = plan.mensal || {};
let db = null, meuId = null, dbPronto = false, gerados = [], planDoc = null;
let sel = { ponto: {}, area: {}, passo: {} }, destaque = null, casoSel = 0;
let rascunho = null;

/* ======================= CUSTOS ======================= */
const precoItem = (f, it) => plan.precos[f.id]?.[it.id] ?? it.preco;
const mensalDe = f => plan.mensal[f.id] ?? f.mensal;
const emBRL = (v, moeda) => v * (moeda === "EUR" ? plan.cambioEUR : plan.cambio);
function custoConsumo(cons) { // custo variável (sem franquias), em BRL, por ferramenta
  const linhas = FERRAMENTAS.map(f => {
    let v = 0, faltando = false;
    f.itens.forEach(it => { const q = cons[f.id]?.[it.id] || 0; const p = precoItem(f, it); if (p == null) { if (q) faltando = true; } else v += q * p; });
    return { f, usd: v, brl: emBRL(v, f.moeda), faltando };
  });
  return { linhas, total: linhas.reduce((s, l) => s + l.brl, 0) };
}
function consumoUniao(ids) { // coleta compartilhada: maior consumo de cada item entre os diagnósticos escolhidos
  const out = {};
  ids.forEach(id => { const c = CONSUMO[id]; for (const f in c) for (const u in c[f]) { out[f] = out[f] || {}; out[f][u] = Math.max(out[f][u] || 0, c[f][u]); } });
  return out;
}
function funilMeta() {
  const linhas = TIPOS.map(t => {
    const meta = Number(plan.metas[t.id]) || 0, vendasMes = meta / plan.meses;
    if (t.finalidade === "produto") return { t, meta, vendasMes, reunioes: 0, abordagens: 0, diags: vendasMes };
    const reunioes = plan.taxaFechamento > 0 ? vendasMes / (plan.taxaFechamento / 100) : 0;
    const abordagens = plan.taxaReuniao > 0 ? reunioes / (plan.taxaReuniao / 100) : 0;
    return { t, meta, vendasMes, reunioes, abordagens, diags: abordagens };
  });
  return totais(linhas);
}
function totais(linhas) {
  const tot = (k, f) => linhas.filter(l => !f || l.t.finalidade === f).reduce((s, l) => s + l[k], 0);
  return { linhas, vendasMes: tot("vendasMes", "prospeccao"), reunioes: tot("reunioes"), abordagens: tot("abordagens"), diags: tot("diags"), produto: linhas.find(l => l.t.finalidade === "produto") };
}
function capacidade() { // 18 reuniões por dia distribuídas na proporção das metas
  const M = funilMeta(), cap = (Number(plan.reunioesDia) || 0) * plan.diasUteis;
  const fator = M.reunioes > 0 ? cap / M.reunioes : 0;
  const linhas = M.linhas.map(l => l.t.finalidade === "produto" ? l : { ...l, reunioes: l.reunioes * fator, abordagens: l.abordagens * fator, vendasMes: l.vendasMes * fator, diags: l.diags * fator, vendas6: l.vendasMes * fator * plan.meses });
  const C = totais(linhas);
  return { ...C, cap, fator, meta: M, fechNecessario: cap > 0 ? M.vendasMes / cap * 100 : 0, reunioesNecessariasDia: M.reunioes / plan.diasUteis };
}
function funil() { return plan.cenario === "capacidade" ? capacidade() : funilMeta(); }
function economiaProduto() {
  const custo = custoConsumo(CONSUMO.completo).total * (1 + plan.reserva / 100);
  const preco = Number(plan.precoProduto) || 0, taxas = Number(plan.taxasVenda) || 0, margem = preco - custo - taxas;
  return { custo, preco, taxas, margem, teto: Number(plan.tetoProduto) || 0, parcela: preco / Math.max(1, plan.parcelas || 1) };
}
function custoMensal() {
  const F = funil();
  const uso = {}; // uso[f][item] no mês
  const soma = (cons, k) => { for (const f in cons) for (const u in cons[f]) { uso[f] = uso[f] || {}; uso[f][u] = (uso[f][u] || 0) + cons[f][u] * k; } };
  F.linhas.forEach(l => soma(CONSUMO[l.t.id], l.diags));
  const alertas = [];
  const linhas = FERRAMENTAS.map(f => {
    const m = mensalDe(f); let variavel = 0, semPreco = false;
    f.itens.forEach(it => {
      const q = uso[f.id]?.[it.id] || 0, p = precoItem(f, it), fr = it.franquia || 0;
      if (f.modo === "credito") { if (p != null) variavel += q * p; return; }
      const exced = Math.max(0, q - fr);
      if (exced > 0 && fr) alertas.push(`${f.nome}: ${n0(q)} ${it.rot} por mês, acima das ${n0(fr)} incluídas no plano ${f.plano}.${p == null ? " O preço do excedente não está confirmado; o custo abaixo não inclui esse excedente." : ""}`);
      if (p == null) { if (exced > 0) semPreco = true; } else variavel += exced * p;
    });
    let total = f.modo === "credito" ? Math.max(m, variavel) : m + variavel;
    if (f.id === "apify" && variavel > 100) alertas.push(`Apify: consumo de US$ ${n0(variavel)} por mês passa do teto do Starter (US$ 100). Seria preciso o plano Scale ou maior.`);
    if (f.id === "pagespeed") { const dia = (uso.pagespeed?.testes || 0) / plan.diasUteis; if (dia > 25000) alertas.push(`PageSpeed: ${n0(dia)} testes por dia, acima do limite gratuito de 25.000.`); }
    return { f, uso: uso[f.id] || {}, mensal: m, variavel, total, brl: emBRL(total, f.moeda), semPreco };
  });
  const sub = linhas.reduce((s, l) => s + l.brl, 0), reserva = sub * plan.reserva / 100, total = sub + reserva;
  const diags = F.diags;
  return { F, linhas, sub, reserva, total, dia: total / plan.diasUteis, semana: total / plan.semanasMes, porDiag: diags ? total / diags : 0, alertas };
}

  return `

    <p class="cap" style="margin-top:18px">Diagnósticos de prospecção: baratos, feitos em cada empresa abordada. Metas informadas por Thiago; o ritmo mensal é uma média.</p>

  <section class="secao"><div class="cab-linha"><div class="cab"><span class="over">${plan.cenario === "capacidade" ? `Com ${n0(plan.reunioesDia)} reuniões por dia` : "Para bater as metas"}</span><h2>O tamanho <b>da operação</b></h2></div><a class="btn sec" href="#custos">Ver metas e custos →</a></div>

}

/* ---------- Gerar ---------- */
function novoRascunho(tipos, exemplo) {
  const marc = {}, dentro = {}, evid = {};
  Object.keys(AREAS).forEach(a => { marc[a] = AREAS[a].c.map((_, i) => exemplo ? i < (EXEMPLO[a] || 0) : false); dentro[a] = true; evid[a] = ""; });
  return { id: null, tipos: [...tipos], empresa: exemplo ? "Clínica Exemplo (fictícia)" : "", site: exemplo ? "clinicaexemplo.com.br" : "", cidade: exemplo ? "Goiânia/GO" : "", segmento: exemplo ? "Odontologia" : "", data: hoje(), marc, dentro, evid, valor: { procura: 3090, contato: 3, fecha: 25, ticket: 3000 }, exemplo: !!exemplo };
}
function areasDe(r) {
  const set = new Set(); r.tipos.forEach(id => tipo(id).areas.forEach(a => set.add(a)));
  return Object.keys(AREAS).filter(a => set.has(a));
}
const opcionalEm = (r, a) => r.tipos.every(id => !tipo(id).areas.includes(a) || tipo(id).opcionais.includes(a));
const nota = (r, a) => r.marc[a].filter(Boolean).length * 2;
const faixa = n => n <= 4 ? ["Perdendo cliente", "var(--ruim)"] : n <= 7 ? ["Pode melhorar", "#e0a030"] : ["Funciona", "var(--verde)"];
function calcula(r) {
  const areas = areasDe(r), med = areas.filter(a => r.dentro[a]);
  const media = l => l.length ? Math.round(l.reduce((s, a) => s + nota(r, a), 0) / l.length * 10) / 10 : 0;
  const porTipo = r.tipos.map(id => ({ t: tipo(id), n: media(tipo(id).areas.filter(a => r.dentro[a])) }));
  const urg = med.slice().sort((x, y) => nota(r, x) - nota(r, y) || ORDEM[AREAS[x].g] - ORDEM[AREAS[y].g]).slice(0, 3);
  const plano = { hoje: [], d90: [], m6: [] };
  med.forEach(a => AREAS[a].c.forEach((c, i) => { if (r.marc[a][i]) return; const it = `${AREAS[a].nome}: ${txt(c).charAt(0).toLowerCase() + txt(c).slice(1)}`; if (rapido(c)) plano.hoje.push(it); else if (urg.includes(a) || AREAS[a].h === "90") plano.d90.push(it); else plano.m6.push(it); }));
  const v = r.valor, contatos = Math.round(v.procura * v.contato / 100), clientes = Math.round(contatos * v.fecha / 100);
  const custo = custoConsumo(consumoUniao(r.tipos)), soma = r.tipos.reduce((s, id) => s + custoConsumo(CONSUMO[id]).total, 0);
  const virada = a => { for (const id of r.tipos) { const P = pontosDe(tipo(id)); const k = P.findIndex(p => p[6].includes(a)); if (k >= 0) return { t: tipo(id), i: k, p: P[k] }; } return null; };
  return { areas, med, geral: media(med), porTipo, urg, plano, contatos, clientes, total: clientes * v.ticket, temValor: r.tipos.some(id => tipo(id).valor), custo, soma, virada };
}
function telaGerar() {
  if (!rascunho) rascunho = novoRascunho(["site", "seo"], true);
  if (destaque && destaque.tipo && !rascunho.tipos.includes(destaque.tipo)) { rascunho.tipos = rascunho.exemplo ? [destaque.tipo] : [...rascunho.tipos, destaque.tipo]; }
  const r = rascunho, areas = areasDe(r);
  const campo = (id, rot, val, type = "text", extra = "") => `<div class="campo"><label for="f-${id}">${rot}</label><input id="f-${id}" type="${type}" value="${esc(val)}" ${extra}></div>`;
  return `<section class="secao"><div class="cab-linha"><div class="cab"><span class="over">Gerar diagnóstico</span><h1>Um cliente, <b>um ou mais diagnósticos</b></h1><p class="lead">Escolha os diagnósticos deste cliente. Eles se somam: as áreas se unem e a coleta compartilhada é feita uma vez só.</p></div><button class="btn sec" type="button" id="b-novo">Novo diagnóstico</button></div>
    ${r.exemplo ? `<p class="small" style="color:var(--medio);margin-bottom:20px">Exemplo com dados fictícios. Use "Novo diagnóstico" para começar um de verdade.</p>` : ""}
    <div class="gerar"><div>
      <div class="bloco-g"><h4>Diagnósticos deste cliente</h4><div class="escolhe">${TIPOS.map(t => `<label class="${r.tipos.includes(t.id) ? "on" : ""}"><input type="checkbox" data-tipo-g="${t.id}"${r.tipos.includes(t.id) ? " checked" : ""}><b>${esc(t.nome)}</b><span>${esc(t.sub)}</span></label>`).join("")}</div></div>
      <div class="bloco-g"><h4>Empresa</h4><div class="campos">${campo("empresa", "Empresa", r.empresa)}${campo("site", "Site", r.site)}${campo("cidade", "Cidade/UF", r.cidade)}${campo("segmento", "Segmento", r.segmento)}${campo("data", "Data da coleta", r.data, "date")}</div></div>
      ${coletaHTML(r, areas)}
      <div class="bloco-g"><h4>Critérios e evidências <span class="cap" style="font-weight:400">· ${areas.length} áreas</span></h4><p class="small suave">Marque o que a empresa já cumpre e registre a evidência: URL, print ou observação, com a data. Nenhuma nota sem dado.</p>
        <div class="areas-g">${areas.map(a => { const A = AREAS[a]; return `<div class="area-g${r.dentro[a] ? "" : " fora"}" id="g-${a}"><div class="t"><h4>${esc(A.nome)}</h4><span class="nota" id="gn-${a}"></span></div><span class="u" id="gu-${a}"></span>
          ${A.c.map((c, i) => `<label class="ck"><input type="checkbox" data-a="${a}" data-i="${i}"${r.marc[a][i] ? " checked" : ""}><span>${esc(txt(c))}</span></label>`).join("")}
          <textarea data-evid="${a}" placeholder="Evidência: URL, print ou observação" aria-label="Evidência de ${esc(A.nome)}">${esc(r.evid[a] || "")}</textarea>
          <div class="pe"><span>${esc(A.fonte)}</span><label><input type="checkbox" data-dentro="${a}"${r.dentro[a] ? " checked" : ""}> medida${opcionalEm(r, a) ? " (opcional)" : ""}</label></div></div>`; }).join("")}</div></div>
      ${r.tipos.some(id => tipo(id).valor) ? `<div class="bloco-g"><h4>Quanto vale</h4><div class="campos">${campo("procura", "Buscas por mês na cidade", r.valor.procura, "number", 'min="0" step="10"')}${campo("contato", "% que entra em contato", r.valor.contato, "number", 'min="0" max="100" step="0.5"')}${campo("fecha", "% que fecha", r.valor.fecha, "number", 'min="0" max="100" step="1"')}${campo("ticket", "Ticket médio (R$)", r.valor.ticket, "number", 'min="0" step="50"')}</div></div>` : ""}
    </div><aside class="res" id="resultado" aria-live="polite"></aside></div></section>`;
}

    <div class="bl"><span class="over">As três urgências</span><ol class="urgs">${c.urg.map((a, i) => { const v = c.virada(a); return `<li><button type="button" data-ir="${a}"><span class="i">${i + 1}</span><b>${esc(AREAS[a].nome)}</b><span>${nota(r, a)}/10</span><span class="s">Resolve: <strong>${esc(AREAS[a].sol)}</strong>${v ? `<br>Vira o jogo: ${esc(v.p[0])}` : ""}</span></button></li>`; }).join("")}</ol></div>

  document.querySelectorAll("textarea[data-evid]").forEach(el => el.addEventListener("input", e => { r.evid[el.dataset.evid] = e.target.value; }));
  document.getElementById("b-novo").onclick = () => { rascunho = novoRascunho(r.tipos.length ? r.tipos : ["site"], false); rota(); };
  const ba = document.getElementById("b-apify"); if (ba) ba.onclick = coletarApify;
  ["ap-busca", "ap-cidade", "ap-n"].forEach(id => { const el = document.getElementById(id); if (el) el.addEventListener("input", () => { r[{ "ap-busca": "apBusca", "ap-cidade": "apCidade", "ap-n": "apN" }[id]] = el.value; }); });
  document.querySelectorAll("[data-alvo]").forEach(bt => bt.onclick = () => { r.coleta.alvo = +bt.dataset.alvo; aplicarColeta(r); const y = scrollY; rota(); scrollTo(0, y); });
}
function ligarGerados() {
  document.querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = () => {
    const g = gerados.find(x => x._id === tr.dataset.id); if (!g) return;
    const ts = (g.tipos || (g.tipo ? [g.tipo] : [])).filter(id => tipo(id)); if (!ts.length) return;
    const base = novoRascunho(ts, false);
    rascunho = { ...base, id: g._id, criadoEm: g.criadoEm, empresa: g.empresa || "", site: g.site || "", cidade: g.cidade || "", segmento: g.segmento || "", data: g.data || hoje(),
      marc: { ...base.marc, ...JSON.parse(JSON.stringify(g.marc || {})) }, dentro: { ...base.dentro, ...(g.dentro || {}) }, evid: { ...base.evid, ...(g.evid || {}) }, valor: { ...base.valor, ...(g.valor || {}) }, coleta: g.coleta || null };
    location.hash = "gerar";
  });
}
window.addEventListener("hashchange", rota);
rota();

  db.collection("diagnosticos").orderBy("criadoEm", "desc").limit(500).onSnapshot(s => { gerados = s.docs.map(d => ({ _id: d.id, ...d.data() })); dbPronto = true; if (["#gerados", "#custos"].includes(location.hash)) { const y = scrollY; rota(); scrollTo(0, y); } }, () => { dbPronto = true; if (location.hash === "#gerados") rota(); });
