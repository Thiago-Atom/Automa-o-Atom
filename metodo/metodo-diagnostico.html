<title>Diagnósticos Atom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Roboto:wght@300;400;500;700&display=swap">
<style>
/* Aplicação web: barra no topo, menu lateral com os tipos de diagnóstico, conteúdo com abas Método / Processo / Gerar.
   Tudo é clicável e conectado: área ↔ etapa do processo ↔ serviço que resolve ↔ outros diagnósticos.
   Cores e fontes da marca Atom (roxo, verde, Roboto, IBM Plex Mono). Tema claro, como a marca. */
:root {
  color-scheme: light;
  --roxo: #461b77;
  --roxo-esc: #36135e;
  --verde: #00c864;
  --verde-esc: #078a48;
  --tinta: #1e1e1e;
  --cinza: #5f5a66;
  --fio: #e6e3ea;
  --fundo: #ffffff;
  --lateral: #f7f6f9;
  --lavanda: #f1edf8;
  --ruim: #c0392b; --ruim-bg: #fdecea;
  --medio: #b26a00; --medio-bg: #fdf3e1;
  --bom: #078a48; --bom-bg: #e6f7ee;
  --sans: Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--fundo); color: var(--tinta); font-family: var(--sans); font-size: 14px; line-height: 1.55; }
p { margin: 0; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: var(--roxo); }
.cinza { color: var(--cinza); }

/* Barra */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--fundo); border-bottom: 1px solid var(--fio); }
.topo .in { display: flex; align-items: center; gap: 20px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.topo img { height: 28px; width: auto; display: block; }
.topo .app { font-weight: 500; color: var(--cinza); padding-left: 16px; border-left: 1px solid var(--fio); }
.topo nav { margin-left: auto; display: flex; gap: 4px; }
.topo nav a { text-decoration: none; color: var(--cinza); font-weight: 500; padding: 8px 12px; border-radius: 6px; }
.topo nav a:hover { background: var(--lateral); color: var(--tinta); }
.topo nav a.on { color: var(--roxo); background: var(--lavanda); }
@media (max-width: 640px) { .topo .app { display: none; } .topo nav a { padding: 8px 8px; } }

/* Estrutura */
.app-grid { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: calc(100% - 50px); }
@media (max-width: 900px) { .app-grid { grid-template-columns: 1fr; } }
.lado { background: var(--lateral); border-right: 1px solid var(--fio); padding: 20px 12px 32px max(12px, env(safe-area-inset-left, 0px)); }
@media (max-width: 900px) { .lado { display: none; } }
.lado h4 { font-family: var(--mono); font-weight: 500; font-size: .64rem; letter-spacing: .2em; text-transform: uppercase; color: var(--cinza); padding: 0 10px; margin: 18px 0 6px; }
.lado h4:first-child { margin-top: 0; }
.lado a { display: grid; gap: 1px; padding: 9px 10px; border-radius: 6px; text-decoration: none; color: var(--tinta); }
.lado a small { color: var(--cinza); font-size: .76rem; }
.lado a:hover { background: #eeebf3; }
.lado a.on { background: var(--fundo); box-shadow: inset 3px 0 0 var(--roxo), 0 1px 2px rgba(30, 30, 30, .06); }
.lado a.on b { color: var(--roxo); }
.lado b { font-weight: 500; }
.escolha { display: none; margin: 0 0 16px; }
@media (max-width: 900px) { .escolha { display: block; } }
.escolha select { width: 100%; padding: 10px 12px; border: 1px solid var(--fio); border-radius: 6px; background: var(--fundo); }

main { padding: 26px max(16px, env(safe-area-inset-right, 0px)) 60px 32px; min-width: 0; }
@media (max-width: 900px) { main { padding-left: max(16px, env(safe-area-inset-left, 0px)); } }
.miolo { max-width: 1200px; }

/* Cabeçalho do tipo */
.cab { display: grid; gap: 8px; padding-bottom: 18px; }
.cab h1 { font-size: clamp(1.6rem, 2.6vw, 2.1rem); font-weight: 300; line-height: 1.15; }
.cab h1 b { font-weight: 700; }
.cab p { color: var(--cinza); max-width: 78ch; }
.fichas { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 6px; }
.fichas div { display: grid; gap: 1px; }
.fichas b { font-weight: 500; }
.selo { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; white-space: nowrap; font-weight: 500; }
.selo.ok { background: var(--bom-bg); color: var(--bom); }
.selo.disc { background: var(--medio-bg); color: var(--medio); }
.selo.adef { background: var(--lateral); color: var(--cinza); box-shadow: inset 0 0 0 1px var(--fio); }
.selo.auto { background: var(--lavanda); color: var(--roxo); }
.selo.parcial { background: var(--medio-bg); color: var(--medio); }
.selo.manual { background: var(--lateral); color: var(--cinza); box-shadow: inset 0 0 0 1px var(--fio); }

/* Abas */
.abas { display: flex; gap: 2px; border-bottom: 1px solid var(--fio); margin-bottom: 24px; overflow-x: auto; }
.abas a { text-decoration: none; color: var(--cinza); font-weight: 500; padding: 10px 16px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.abas a:hover { color: var(--tinta); }
.abas a.on { color: var(--roxo); border-bottom-color: var(--roxo); }
.abas a span { font-family: var(--mono); font-size: .62rem; color: var(--cinza); margin-left: 6px; }

.bloco { margin-bottom: 34px; }
.bloco > h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
.bloco > p.sub { color: var(--cinza); margin-bottom: 14px; max-width: 80ch; }

/* Método: lista de áreas + painel da área selecionada */
.met { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 24px; align-items: start; }
@media (max-width: 1060px) { .met { grid-template-columns: 1fr; } }
.areas-tab { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.area-m { border: 1px solid var(--fio); border-radius: 6px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; background: var(--fundo); text-align: left; cursor: pointer; transition: border-color .12s, box-shadow .12s; }
.area-m:hover { border-color: #c9bfd9; }
.area-m.on { border-color: var(--roxo); box-shadow: inset 3px 0 0 var(--roxo); }
.area-m.luz { border-color: var(--verde); box-shadow: inset 3px 0 0 var(--verde); }
.area-m .t { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.area-m h3 { font-size: .95rem; font-weight: 700; }
.area-m .mini { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .76rem; color: var(--cinza); }
.painel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); border: 1px solid var(--fio); border-radius: 8px; overflow: hidden; background: var(--fundo); }
.painel .pc { background: var(--roxo); color: #fff; padding: 14px 16px; display: grid; gap: 3px; }
.painel .pc .mono { color: var(--verde); }
.painel .pc h3 { font-size: 1.15rem; font-weight: 700; }
.painel .pb { padding: 14px 16px; display: grid; gap: 14px; }
.painel ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; counter-reset: k; }
.painel ol li { counter-increment: k; display: grid; grid-template-columns: 20px 1fr auto; gap: 6px; font-size: .86rem; }
.painel ol li::before { content: counter(k); font-family: var(--mono); font-size: .7rem; color: var(--roxo); padding-top: 2px; }
.rap { font-family: var(--mono); font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--verde-esc); white-space: nowrap; padding-top: 3px; }
.liga { display: grid; gap: 6px; }
.liga .mono { color: var(--cinza); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--fio); background: var(--fundo); border-radius: 999px; padding: 5px 11px; font-size: .8rem; cursor: pointer; text-decoration: none; color: var(--tinta); display: inline-flex; gap: 6px; align-items: center; }
.chip:hover { border-color: var(--roxo); color: var(--roxo); }
.chip.sol { background: var(--lavanda); border-color: transparent; color: var(--roxo); font-weight: 500; }
.chip.etapa::before { content: attr(data-n); font-family: var(--mono); font-size: .68rem; color: var(--verde-esc); }

.regua { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--fio); border-radius: 6px; overflow: hidden; }
@media (max-width: 640px) { .regua { grid-template-columns: 1fr; } }
.regua div { padding: 14px 16px; display: grid; gap: 4px; }
.regua b { font-size: 1.5rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.regua .r { background: var(--ruim-bg); } .regua .r b { color: var(--ruim); }
.regua .m { background: var(--medio-bg); } .regua .m b { color: var(--medio); }
.regua .b { background: var(--bom-bg); } .regua .b b { color: var(--bom); }

.doze { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; }
@media (max-width: 760px) { .doze { grid-template-columns: 1fr; } }
.doze li { display: grid; grid-template-columns: 30px 1fr; gap: 8px; padding: 11px 0; border-top: 1px solid var(--fio); }
.doze .n { font-family: var(--mono); font-size: .76rem; color: var(--roxo); padding-top: 1px; }
.doze li:nth-child(-n+3) .n { color: var(--verde-esc); font-weight: 500; }
.doze b { font-weight: 700; display: block; }
.doze p { color: var(--cinza); font-size: .86rem; }

/* Processo */
.resumo-proc { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 6px 0 18px; max-width: 520px; }
.resumo-proc i { display: block; }
.proc { list-style: none; margin: 0; padding: 0; }
.proc li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; padding-bottom: 14px; position: relative; }
.proc li::after { content: ""; position: absolute; left: 16px; top: 34px; bottom: 0; width: 2px; background: var(--fio); }
.proc li:last-child::after { display: none; }
.proc .bola { width: 34px; height: 34px; border-radius: 50%; background: var(--fundo); border: 2px solid var(--verde); display: grid; place-items: center; font-family: var(--mono); font-size: .76rem; font-weight: 500; color: var(--roxo); z-index: 1; }
.proc .c { border: 1px solid transparent; border-radius: 8px; padding: 6px 12px 12px; display: grid; gap: 6px; cursor: pointer; text-align: left; background: none; width: 100%; }
.proc .c:hover { background: var(--lateral); }
.proc li.on .c { border-color: var(--roxo); background: var(--fundo); box-shadow: 0 1px 2px rgba(30, 30, 30, .05); }
.proc li.on .bola { background: var(--roxo); color: #fff; border-color: var(--roxo); }
.proc h3 { font-size: 1rem; font-weight: 700; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.proc p { color: var(--cinza); max-width: 80ch; }
.proc dl { margin: 2px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 6px 18px; font-size: .84rem; }
.proc dt { font-family: var(--mono); font-size: .6rem; letter-spacing: .16em; text-transform: uppercase; color: var(--cinza); }
.proc dd { margin: 0; }
.proc .detalhe { display: none; border-top: 1px solid var(--fio); padding-top: 10px; margin-top: 4px; gap: 6px; }
.proc li.on .detalhe { display: grid; }

/* Gerar */
.gerar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 28px; align-items: start; }
@media (max-width: 1100px) { .gerar { grid-template-columns: 1fr; } }
.form { display: grid; gap: 22px; }
.campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.campo { display: grid; gap: 4px; }
.campo label { font-size: .78rem; font-weight: 500; color: var(--cinza); }
.campo input { padding: 9px 10px; border: 1px solid var(--fio); border-radius: 5px; background: var(--fundo); width: 100%; font-variant-numeric: tabular-nums; }
.campo input:focus { outline: none; border-color: var(--roxo); box-shadow: 0 0 0 3px var(--lavanda); }
.secao { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--fio); padding-bottom: 6px; margin-bottom: 10px; }
.secao h3 { font-size: .98rem; font-weight: 700; }
.marcar { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.area-g { border: 1px solid var(--fio); border-radius: 6px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; transition: border-color .15s, box-shadow .15s; }
.area-g.fora { background: var(--lateral); }
.area-g.urg-1, .area-g.urg-2, .area-g.urg-3 { border-color: var(--ruim); box-shadow: inset 3px 0 0 var(--ruim); }
.area-g.luz { border-color: var(--roxo); box-shadow: 0 0 0 3px var(--lavanda); }
.area-g .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.area-g h4 { font-size: .92rem; font-weight: 700; }
.area-g .nota { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.area-g.fora .nota { color: var(--cinza); font-weight: 400; }
.area-g .tag-u { font-family: var(--mono); font-size: .58rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ruim); }
.ck { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; font-size: .84rem; cursor: pointer; padding: 2px 0; }
.area-g.fora .ck { color: var(--cinza); }
.ck input { margin: 3px 0 0; accent-color: var(--roxo); width: 14px; height: 14px; }
.area-g .pe { display: flex; justify-content: space-between; gap: 8px; font-size: .74rem; color: var(--cinza); border-top: 1px solid var(--fio); padding-top: 6px; margin-top: 2px; }
.area-g .pe label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.area-g .pe input { accent-color: var(--roxo); }

/* Resultado */
.result { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); border: 1px solid var(--fio); border-radius: 8px; overflow: hidden; }
.result .rcab { background: var(--roxo); color: #fff; padding: 16px 18px; display: grid; gap: 4px; }
.result .rcab .mono { color: var(--verde); }
.result .rcab h3 { font-size: 1.1rem; font-weight: 700; }
.result .rcab p { color: #d9cfe8; font-size: .82rem; }
.result .rcorpo { padding: 16px 18px; display: grid; gap: 16px; }
.geral { display: flex; align-items: center; gap: 14px; }
.geral .v { font-size: 2.6rem; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
.geral .v small { font-size: .9rem; color: var(--cinza); }
.barra-l { display: grid; grid-template-columns: minmax(0, 1fr) 90px 38px; gap: 8px; align-items: center; padding: 5px 4px; border-top: 1px solid var(--fio); font-size: .82rem; cursor: pointer; border-radius: 3px; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.barra-l:hover { background: var(--lateral); }
.barra-l .tr { height: 8px; background: var(--lateral); border-radius: 2px; overflow: hidden; }
.barra-l .tr i { display: block; height: 100%; transition: width .25s; }
.barra-l .v { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.urgs { display: grid; gap: 8px; margin-top: 6px; }
.urgs button { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: baseline; text-align: left; padding: 9px 10px; border: 1px solid var(--fio); border-radius: 6px; background: var(--fundo); cursor: pointer; }
.urgs button:hover { border-color: var(--ruim); }
.urgs .i { font-weight: 700; color: var(--ruim); }
.urgs .s { grid-column: 2 / -1; font-size: .78rem; color: var(--roxo); }
.lista-r { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: .84rem; }
.lista-r li { display: grid; grid-template-columns: 16px 1fr; gap: 4px; }
.lista-r li::before { content: "→"; color: var(--verde-esc); }
.plano-r { display: grid; gap: 10px; }
.plano-r > div { border-left: 3px solid var(--roxo); padding-left: 10px; display: grid; gap: 4px; }
.plano-r > div.g { border-left-color: var(--verde); }
.plano-r b { font-size: .82rem; }
.valor-r { background: var(--lavanda); border-radius: 6px; padding: 12px 14px; display: grid; gap: 2px; }
.valor-r .v { font-size: 1.6rem; font-weight: 500; color: var(--roxo); font-variant-numeric: tabular-nums; }
.valor-r small { color: var(--cinza); font-size: .78rem; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 0; border-radius: 6px; padding: 10px 14px; font-weight: 700; cursor: pointer; background: var(--roxo); color: #fff; text-decoration: none; display: inline-block; }
.btn:hover { background: var(--roxo-esc); }
.btn.sec { background: var(--fundo); color: var(--roxo); box-shadow: inset 0 0 0 1px var(--fio); }
.btn.sec:hover { background: var(--lateral); }
.btn[disabled] { opacity: .55; cursor: default; }
.msg { font-size: .8rem; color: var(--cinza); min-height: 1.2em; }
.aviso { font-size: .8rem; color: var(--medio); background: var(--medio-bg); border-radius: 5px; padding: 8px 10px; }

/* Lista de gerados */
.tab { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tab th { text-align: left; font-family: var(--mono); font-weight: 500; font-size: .6rem; letter-spacing: .16em; text-transform: uppercase; color: var(--cinza); padding: 0 12px 8px 0; border-bottom: 1px solid var(--fio); }
.tab td { padding: 11px 12px 11px 0; border-bottom: 1px solid var(--fio); vertical-align: middle; }
.tab td.n { font-variant-numeric: tabular-nums; font-weight: 700; }
.tab tr.click { cursor: pointer; }
.tab tr.click:hover td { background: var(--lateral); }
.rolar { overflow-x: auto; }
.vazio { border: 1px dashed var(--fio); border-radius: 8px; padding: 28px; text-align: center; color: var(--cinza); display: grid; gap: 8px; justify-items: center; }

/* Visão geral */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.card { border: 1px solid var(--fio); border-radius: 8px; padding: 16px; display: grid; gap: 8px; text-decoration: none; color: var(--tinta); align-content: start; }
.card:hover { border-color: var(--roxo); }
.card h3 { font-size: 1rem; font-weight: 700; }
.card p { color: var(--cinza); font-size: .86rem; }
.card .pe { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .76rem; color: var(--cinza); border-top: 1px solid var(--fio); padding-top: 8px; margin-top: 4px; }
.card .pe span:last-child { color: var(--roxo); font-weight: 500; }
.fluxo { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .fluxo { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 500px) { .fluxo { grid-template-columns: 1fr; } }
.fluxo div { display: grid; gap: 4px; align-content: start; }
.fluxo i { display: flex; align-items: center; margin-bottom: 6px; }
.fluxo i::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--verde); flex: none; }
.fluxo i::after { content: ""; flex: 1; height: 2px; background: var(--verde); }
.fluxo b { font-weight: 700; }
.fluxo p { color: var(--cinza); font-size: .84rem; }
/* Matriz área × tipo */
.matriz { border-collapse: collapse; font-size: .8rem; }
.matriz th { font-weight: 500; padding: 6px 8px; text-align: center; color: var(--cinza); font-size: .74rem; vertical-align: bottom; }
.matriz th.l { text-align: left; }
.matriz td { border-top: 1px solid var(--fio); padding: 0; text-align: center; }
.matriz td.l { text-align: left; padding: 6px 12px 6px 0; white-space: nowrap; }
.matriz td a { display: block; padding: 6px 8px; text-decoration: none; }
.matriz td a i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--roxo); }
.matriz td a:hover { background: var(--lavanda); }
.matriz tr:hover td.l { color: var(--roxo); }
.hist { width: 100%; border-collapse: collapse; font-size: .86rem; }
.hist td { padding: 8px 12px 8px 0; border-top: 1px solid var(--fio); vertical-align: top; }
.hist td:first-child { font-family: var(--mono); font-size: .72rem; color: var(--roxo); white-space: nowrap; width: 1%; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="topo">
  <div class="in">
    <a href="#inicio" aria-label="Início"><img src="assets/logo.jpg" alt="ATOM Agência de IA" width="285" height="105"></a>
    <span class="app">Diagnósticos</span>

function novoRascunho(tipo, exemplo) {
  const t = TIPOS.find(x => x.id === tipo);
  const marc = {}, dentro = {};
  t.areas.forEach(a => { marc[a] = AREAS[a].c.map((_, i) => exemplo ? i < (EXEMPLO[a] || 0) : false); dentro[a] = true; });
  return { id: null, tipo, empresa: exemplo ? "Clínica Exemplo (fictícia)" : "", site: exemplo ? "clinicaexemplo.com.br" : "", cidade: exemplo ? "Goiânia/GO" : "",
    segmento: exemplo ? "Odontologia" : "", data: hoje(), marc, dentro, valor: { procura: 3090, contato: 3, fecha: 25, ticket: 3000 }, exemplo: !!exemplo };
}

/* ======================= CÁLCULOS ======================= */
const nota = (r, a) => r.marc[a].filter(Boolean).length * 2;
const faixa = n => n <= 4 ? ["Perdendo cliente", "var(--ruim)", "r"] : n <= 7 ? ["Pode melhorar", "var(--medio)", "m"] : ["Funciona", "var(--bom)", "b"];
function calcula(r) {
  const t = TIPOS.find(x => x.id === r.tipo);
  const med = t.areas.filter(a => r.dentro[a]);
  const geral = med.length ? Math.round(med.reduce((s, a) => s + nota(r, a), 0) / med.length * 10) / 10 : 0;
  const urg = med.slice().sort((x, y) => nota(r, x) - nota(r, y) || ORDEM[AREAS[x].g] - ORDEM[AREAS[y].g]).slice(0, 3);
  const plano = { hoje: [], d90: [], m6: [] };
  med.forEach(a => AREAS[a].c.forEach((c, i) => {
    if (r.marc[a][i]) return;
    const item = `${AREAS[a].nome}: ${txt(c).charAt(0).toLowerCase() + txt(c).slice(1)}`;
    if (rapido(c)) plano.hoje.push(item);
    else if (urg.includes(a) || AREAS[a].h === "90") plano.d90.push(item);
    else plano.m6.push(item);
  }));
  const v = r.valor, contatos = Math.round(v.procura * v.contato / 100), clientes = Math.round(contatos * v.fecha / 100);
  return { t, med, geral, urg, plano, contatos, clientes, total: clientes * v.ticket };
}

    <div class="rcorpo">
      <div class="geral"><span class="v">${c.geral.toLocaleString("pt-BR", { minimumFractionDigits: 1 })}<small>/10</small></span><div><b style="color:${fc}">${fl}</b><p class="cinza" style="font-size:.8rem">${c.med.length} de ${t.areas.length} áreas medidas · clique numa barra para ir até a área</p></div></div>
      <div>${c.med.map(a => { const n = nota(r, a); return `<button type="button" class="barra-l" data-ir="${a}"><span>${esc(AREAS[a].nome)}</span><span class="tr"><i style="width:${n * 10}%;background:${faixa(n)[1]}"></i></span><span class="v">${n}/10</span></button>`; }).join("")}</div>
      <div><span class="mono">As três urgências e quem resolve</span><div class="urgs">${c.urg.map((a, i) => `<button type="button" data-ir="${a}"><span class="i">${i + 1}.</span><b>${esc(AREAS[a].nome)}</b><span>${nota(r, a)}/10</span><span class="s">→ ${esc(AREAS[a].sol)}</span></button>`).join("")}</div></div>
      ${t.valor ? `<div class="valor-r"><span class="mono">Quanto vale por mês</span><span class="v">${brl(c.total)}</span><small>${r.valor.procura.toLocaleString("pt-BR")} buscas × ${r.valor.contato}% = ${c.contatos} contatos × ${r.valor.fecha}% = ${c.clientes} clientes × ${brl(r.valor.ticket)}</small></div>` : ""}
      <div class="plano-r"><span class="mono">Plano</span>
        <div class="g"><b>Hoje · grátis</b>${lista(c.plano.hoje)}</div>
        <div><b>Em 90 dias · ser encontrado</b>${lista(c.plano.d90)}</div>
        <div><b>Em 6 meses · ser escolhido</b>${lista(c.plano.m6)}</div></div>
      <div class="acoes">${db ? `<button class="btn" type="button" id="b-salvar">${r.id ? "Salvar alterações" : "Salvar diagnóstico"}</button>` : ""}<button class="btn sec" type="button" id="b-copiar">Copiar texto</button></div>
      <p class="msg" id="msg">${db ? "" : "Para salvar, abra esta página logado no claude.ai. Copiar o texto funciona sempre."}</p>
    </div>`;
  box.querySelectorAll("[data-ir]").forEach(b => b.onclick = () => iluminar(b.dataset.ir));
  document.getElementById("b-copiar").onclick = copiar;
  if (db) document.getElementById("b-salvar").onclick = salvar;
}

function texto() {
  const r = rascunho, c = calcula(r), t = c.t;
  const L = [`DIAGNÓSTICO ${t.nome.toUpperCase()} · ATOM`, `${r.empresa}${r.site ? " · " + r.site : ""}`, [r.cidade, r.segmento, dataBR(r.data)].filter(Boolean).join(" · "), "",
    `Nota geral: ${c.geral.toLocaleString("pt-BR", { minimumFractionDigits: 1 })}/10 (${faixa(c.geral)[0]})`, ""];
  c.med.forEach(a => L.push(`${AREAS[a].nome}: ${nota(r, a)}/10 · ${faixa(nota(r, a))[0]}`));
  t.areas.filter(a => !r.dentro[a]).forEach(a => L.push(`${AREAS[a].nome}: não medida`));
  L.push("", "As três urgências:"); c.urg.forEach((a, i) => L.push(`${i + 1}. ${AREAS[a].nome} (${nota(r, a)}/10) · resolve: ${AREAS[a].sol}`));
  if (t.valor) L.push("", `Quanto vale: ${brl(c.total)} por mês (${r.valor.procura} buscas × ${r.valor.contato}% × ${r.valor.fecha}% × ${brl(r.valor.ticket)}). É o tamanho da procura, não promessa de faturamento.`);
  L.push("", "Plano", "Hoje · grátis:"); c.plano.hoje.forEach(x => L.push("→ " + x));
  L.push("Em 90 dias:"); c.plano.d90.forEach(x => L.push("→ " + x));
  L.push("Em 6 meses:"); c.plano.m6.forEach(x => L.push("→ " + x));
  return L.join("\n");
}
async function copiar() {
  const m = document.getElementById("msg");
  try { await navigator.clipboard.writeText(texto()); m.textContent = "Texto copiado."; }
  catch (e) { m.textContent = "Não foi possível copiar automaticamente. Selecione e copie o texto abaixo."; m.insertAdjacentHTML("afterend", `<textarea readonly style="width:100%;height:160px;font:12px var(--mono)">${esc(texto())}</textarea>`); }
}
async function salvar() {
  const r = rascunho, c = calcula(r), m = document.getElementById("msg"), b = document.getElementById("b-salvar");
  if (!r.empresa.trim()) { m.textContent = "Preencha o nome da empresa antes de salvar."; document.getElementById("f-empresa")?.focus(); return; }
  b.disabled = true; m.textContent = "Salvando…";
  const doc = { tipo: r.tipo, empresa: r.empresa.trim(), site: r.site, cidade: r.cidade, segmento: r.segmento, data: r.data,
    marc: r.marc, dentro: r.dentro, valor: r.valor, geral: c.geral, urgencias: c.urg, atualizadoEm: Date.now(), autor: meuId };
  try {
    if (r.id) await db.collection("diagnosticos").doc(r.id).set({ ...doc, criadoEm: r.criadoEm || Date.now() });
    else { const ref = await db.collection("diagnosticos").add({ ...doc, criadoEm: doc.atualizadoEm }); r.id = ref.id; r.criadoEm = doc.atualizadoEm; }
    r.exemplo = false; m.textContent = "Diagnóstico salvo. Ele aparece em Gerados.";
  } catch (e) { m.textContent = e && e.code === "permission_denied" ? "Você não tem permissão para salvar nesta página." : "Não foi possível salvar agora. Tente de novo."; }
  b.disabled = false; if (r.id) b.textContent = "Salvar alterações";
}

function telaGerados() {
  lateral(null);
  const corpo = !db ? `<div class="vazio"><b>Lista indisponível nesta visualização</b><span>Abra a página logado no claude.ai para ver e salvar diagnósticos.</span></div>`
    : !dbPronto ? `<div class="vazio"><span>Carregando diagnósticos…</span></div>`
    : !gerados.length ? `<div class="vazio"><b>Nenhum diagnóstico salvo ainda</b><span>Escolha um tipo, abra a aba "Gerar diagnóstico", preencha e clique em "Salvar diagnóstico".</span><a class="btn" href="#digital-gerar">Gerar o primeiro</a></div>`
    : `<div class="rolar"><table class="tab"><thead><tr><th>Empresa</th><th>Tipo</th><th>Cidade</th><th>Nota</th><th>Urgência principal</th><th>Data</th></tr></thead><tbody>
      ${gerados.map(g => { const t = TIPOS.find(x => x.id === g.tipo); const n = Number(g.geral) || 0; return `<tr class="click" data-id="${esc(g._id)}"><td><b>${esc(g.empresa)}</b></td><td>${esc(t ? t.nome : g.tipo)}</td><td>${esc(g.cidade)}</td><td class="n" style="color:${faixa(n)[1]}">${n.toLocaleString("pt-BR", { minimumFractionDigits: 1 })}</td><td>${esc(AREAS[(g.urgencias || [])[0]]?.nome || "")}</td><td>${esc(dataBR(g.data))}</td></tr>`; }).join("")}
      </tbody></table></div>`;
  return `<div class="cab"><span class="mono">Gerados</span><h1>Diagnósticos <b>salvos</b></h1><p>Todos os diagnósticos gerados nesta página. Clique em um para abrir, revisar e salvar de novo.</p></div>${corpo}`;
}

/* ======================= ROTAS E EVENTOS ======================= */
function rota() {
  const h = (location.hash || "#inicio").slice(1);
  const tela = document.getElementById("tela");
  ["inicio", "tipos", "gerados"].forEach(n => document.getElementById("nav-" + n).classList.remove("on"));
  let t = null;
  if (h === "gerados") { document.getElementById("nav-gerados").classList.add("on"); tela.innerHTML = telaGerados(); ligarGerados(); }
  else {
    const [id, aba] = h.split("-");
    t = TIPOS.find(x => x.id === id);
    if (!t) { document.getElementById("nav-inicio").classList.add("on"); tela.innerHTML = telaInicio(); }
    else {
      document.getElementById("nav-tipos").classList.add("on"); lateral(t.id);
      if (aba === "processo") { tela.innerHTML = telaProcesso(t); ligarProcesso(t); }
      else if (aba === "gerar") { tela.innerHTML = telaGerar(t); ligarGerar(); resultado(); }
      else { tela.innerHTML = telaMetodo(t); ligarMetodo(t); }
    }
  }
  const sel = document.getElementById("sel-tipo");
  if (sel) sel.onchange = () => { if (!sel.value) return; const aba = (location.hash.split("-")[1]) || "metodo"; location.hash = sel.value + "-" + aba; };
  window.scrollTo(0, 0);
  if (destaque && t && h.endsWith("-gerar")) { const d = destaque; destaque = null; setTimeout(() => iluminar(d), 60); }
}
// Cliques que carregam seleção para a próxima tela (área, etapa, destaque).
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-area][data-tipo]"); if (a) areaSel[a.dataset.tipo] = a.dataset.area;
  const p = e.target.closest("a[data-passo]"); if (p) { const id = (location.hash.slice(1).split("-")[0]); passoSel[id] = +p.dataset.passo; }
  const d = e.target.closest("a[data-destaque]"); if (d) destaque = d.dataset.destaque;
}, true);
function ligarMetodo(t) {
  document.querySelectorAll(".area-m").forEach(b => b.onclick = () => {
    areaSel[t.id] = b.dataset.area;
    document.querySelectorAll(".area-m").forEach(x => x.classList.toggle("on", x === b));
    painelArea(t);
    if (matchMedia("(max-width: 1060px)").matches) document.getElementById("painel").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  painelArea(t);
}
function ligarProcesso(t) {
  const marcar = i => { passoSel[t.id] = i; document.querySelectorAll(".proc li").forEach(li => li.classList.toggle("on", +li.dataset.i === i)); };
  document.querySelectorAll(".proc .c").forEach(c => {
    c.onclick = e => { if (e.target.closest("a")) return; marcar(+c.dataset.passo); };
    c.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); marcar(+c.dataset.passo); } };
  });
  const on = document.querySelector(".proc li.on"); if (on && passoSel[t.id] > 1) on.scrollIntoView({ block: "center" });
}
function ligarGerar() {
  const r = rascunho;
  ["empresa", "site", "cidade", "segmento", "data"].forEach(k => document.getElementById("f-" + k).addEventListener("input", e => { r[k] = e.target.value; resultado(); }));
  ["procura", "contato", "fecha", "ticket"].forEach(k => { const el = document.getElementById("f-" + k); if (el) el.addEventListener("input", e => { r.valor[k] = Math.max(0, parseFloat(e.target.value) || 0); resultado(); }); });
  document.querySelectorAll("input[data-a]").forEach(el => el.addEventListener("change", e => { r.marc[el.dataset.a][+el.dataset.i] = e.target.checked; resultado(); }));
  document.querySelectorAll("input[data-dentro]").forEach(el => el.addEventListener("change", e => { r.dentro[el.dataset.dentro] = e.target.checked; resultado(); }));
  document.getElementById("b-novo").onclick = () => { rascunho = novoRascunho(r.tipo, false); rota(); };
}
function ligarGerados() {
  document.querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = () => {
    const g = gerados.find(x => x._id === tr.dataset.id); if (!g || !TIPOS.find(x => x.id === g.tipo)) return;
    const base = novoRascunho(g.tipo, false);
    rascunho = { ...base, id: g._id, criadoEm: g.criadoEm, empresa: g.empresa || "", site: g.site || "", cidade: g.cidade || "", segmento: g.segmento || "", data: g.data || hoje(),
      marc: { ...base.marc, ...JSON.parse(JSON.stringify(g.marc || {})) }, dentro: { ...base.dentro, ...(g.dentro || {}) }, valor: { ...base.valor, ...(g.valor || {}) } };
    location.hash = g.tipo + "-gerar";
  });
}
window.addEventListener("hashchange", rota);
rota();

/* ======================= BANCO (diagnósticos salvos) ======================= */
(async () => {
  try {
    db = await window.claude?.use?.("db");
    const user = await window.claude?.use?.("user");
    if (user) meuId = await user.id().catch(() => null);
  } catch (e) { db = null; }
  if (!db) return;
  db.collection("diagnosticos").orderBy("criadoEm", "desc").limit(500).onSnapshot(s => {
    gerados = s.docs.map(d => ({ _id: d.id, ...d.data() })); dbPronto = true;
    if (location.hash === "#gerados") rota();
  }, () => { dbPronto = true; if (location.hash === "#gerados") rota(); });
  if (location.hash.endsWith("-gerar")) resultado();
})();
</script>
