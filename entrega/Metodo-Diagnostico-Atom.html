<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
</head><body>
<title>Diagnósticos Atom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Roboto:wght@300;400;500;700&display=swap">
<style>
/* Layout e identidade da Atom (deck Atom 2026 e diagnóstico Coalumaq): fundo branco, títulos Roboto finos com a parte final
   em negrito, etiquetas IBM Plex Mono, seções numeradas, cartões brancos com fio verde e cartão de destaque roxo,
   lascas diagonais nos cantos. Escala tipográfica do mapa: 64/48/32/24/20/18/16/14/12/10, entrelinhas 1.2 e 1.6. */
:root {
  color-scheme: light;
  --sans: Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", "Courier New", monospace;
  --fs-display: 64px; --fs-h1: 48px; --fs-h2: 32px; --fs-h3: 24px; --fs-h4: 20px;
  --fs-lead: 18px; --fs-body: 16px; --fs-small: 14px; --fs-caption: 12px; --fs-overline: 10px;
  --lh-tight: 1.2; --lh-body: 1.6;
  --roxo: #461b77; --roxo-2: #6b4aa0; --verde: #00c864; --verde-texto: #08804a;
  --tinta: #1e1e1e; --suave: #5f5a66; --fio: #e9e6ee; --fio-forte: #d6d1de; --fundo: #ffffff; --tom: #f7f6fa; --lavanda: #f1edf8;
  --ruim: #c62828; --medio: #b26a00; --bom: #08804a;
  --sombra: 0 1px 2px rgba(30, 30, 30, .06), 0 4px 16px rgba(30, 30, 30, .06);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--fundo); color: var(--tinta); font-family: var(--sans); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: clamp(34px, 4.4vw, var(--fs-h1)); line-height: 1.12; font-weight: 300; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-size: clamp(26px, 3vw, var(--fs-h2)); line-height: var(--lh-tight); font-weight: 300; text-wrap: balance; }
h1 b, h2 b { font-weight: 700; }
h3 { font-size: var(--fs-h3); line-height: var(--lh-tight); font-weight: 700; }
h4 { font-size: var(--fs-small); line-height: 1.4; font-weight: 700; }
.lead { font-size: var(--fs-body); color: var(--suave); max-width: 64ch; line-height: 1.75; }
.small { font-size: var(--fs-small); }
.cap { font-size: var(--fs-caption); color: var(--suave); }
.over { font-family: var(--mono); font-size: var(--fs-overline); font-weight: 500; text-transform: uppercase; letter-spacing: .22em; color: var(--roxo); }
.suave { color: var(--suave); }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--roxo); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; }

/* Barra superior */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--fio); }
.topo .in { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 28px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); flex-wrap: wrap; }
.topo img { height: 34px; width: auto; display: block; }
.topo nav { display: flex; gap: 26px; flex-wrap: wrap; margin-left: auto; }
.topo nav a { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--suave); text-decoration: none; padding: 4px 0; border-bottom: 2px solid transparent; }
.topo nav a:hover { color: var(--roxo); }
.topo nav a.on { color: var(--roxo); border-bottom-color: var(--verde); }

.palco { position: relative; }
.lasca { position: absolute; top: 0; right: max(16px, calc((100% - 1280px) / 2 + 16px)); width: clamp(140px, 22vw, 300px); height: auto; pointer-events: none; z-index: 0; }
@media (max-width: 760px) { .lasca { width: 110px; opacity: .9; } }
.pagina { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 56px max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px)); counter-reset: sec; }
.secao { padding-top: 64px; margin-top: 64px; border-top: 1px solid var(--fio); }
.secao:first-child { padding-top: 0; margin-top: 0; border-top: 0; }
.secao:not(:first-child) > .cab h2::before, .secao:not(:first-child) > .cab-linha h2::before { counter-increment: sec; content: counter(sec, decimal-leading-zero); font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--roxo); letter-spacing: .1em; margin-right: 18px; vertical-align: .55em; }
.cab { display: grid; gap: 14px; max-width: 820px; margin-bottom: 36px; }
.secao:first-child > .cab, .secao:first-child > .cab-linha .cab { padding-right: clamp(0px, 20vw, 300px); }
.cab-linha { display: flex; justify-content: space-between; align-items: end; gap: 16px 32px; flex-wrap: wrap; margin-bottom: 30px; }
.cab-linha .cab { margin-bottom: 0; }
.fecho { margin-top: 28px; font-weight: 700; color: var(--roxo); font-size: var(--fs-small); }

/* Abertura da visão geral */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .8fr); gap: 32px; align-items: center; }
.hero img { width: 100%; height: auto; max-height: 340px; object-fit: contain; object-position: right center; display: block; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } .hero img { max-height: 200px; } }

/* Colunas com fio no topo (modelos e metas) */
.colunas { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 28px; }
@media (max-width: 1080px) { .colunas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .colunas { grid-template-columns: 1fr; } }
.col { border-top: 2px solid var(--verde); padding-top: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col.p1 { border-top-color: var(--roxo); }
.col.verde { border-top-color: var(--verde); }
.col .linha-top { display: flex; justify-content: space-between; gap: 8px; }
.col .linha-top .cap { font-family: var(--mono); }
.col h3 { font-size: var(--fs-h3); }
.grande { font-size: clamp(40px, 5vw, var(--fs-display)); line-height: 1.05; font-weight: 500; color: var(--roxo); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.grande small { font-size: var(--fs-caption); font-weight: 700; color: var(--roxo); letter-spacing: 0; margin-left: 10px; vertical-align: .9em; }
.dl { margin: 6px 0 0; }
.dl div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--fio); font-size: var(--fs-small); }
.dl dt { color: var(--suave); }
.dl dd { margin: 0; text-align: right; }
.ir { margin-top: auto; padding: 14px 0; border-bottom: 2px solid var(--fio-forte); display: flex; justify-content: space-between; align-items: center; font-size: var(--fs-small); font-weight: 700; color: var(--roxo); text-decoration: none; }
.ir:hover { border-bottom-color: var(--roxo); }
.ponto { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-caption); color: var(--suave); }
.ponto::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--fio-forte); }
.ponto.ok::before { background: var(--verde); }
.ponto.disc::before { background: #e0a030; }

/* Cartões no padrão Coalumaq: branco com fio verde; o destaque é roxo */
.cartoes > .col, .tres > div { background: var(--fundo); border: 0; border-top: 3px solid var(--verde); box-shadow: var(--sombra); padding: 22px; }
.cartoes > .col.destaque, .tres > div.r { background: var(--roxo); color: #fff; border-top-color: var(--verde); }
.cartoes > .col.destaque .over, .tres > div.r .over { color: var(--verde); }
.cartoes > .col.destaque .suave, .cartoes > .col.destaque .cap, .tres > div.r .suave { color: #d9cfe8; }
.cartoes > .col.destaque .grande { color: #fff; }
.cartoes .grande { font-size: clamp(28px, 3.2vw, 44px); overflow-wrap: anywhere; }
.tres > div.r .setas li::before { color: var(--verde); }

/* Passos (fio verde com ponto) */
.passos { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px; }
@media (max-width: 960px) { .passos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .passos { grid-template-columns: 1fr; } }
.passos div { display: grid; gap: 6px; align-content: start; }
.passos i { display: flex; align-items: center; margin-bottom: 10px; }
.passos i::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--verde); flex: none; }
.passos i::after { content: ""; flex: 1; height: 2px; background: var(--verde); }
.passos b { font-weight: 700; font-size: var(--fs-lead); }
.passos p { font-size: var(--fs-small); color: var(--suave); }

/* Diagnóstico: navegação lateral + conteúdo */
.diag { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 48px; align-items: start; }
.diag > * { min-width: 0; }
@media (max-width: 900px) { .diag { grid-template-columns: minmax(0, 1fr); gap: 24px; } }
.subnav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); display: grid; border-top: 1px solid var(--fio); }
@media (max-width: 900px) { .subnav { position: static; grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.subnav a { display: flex; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--fio); text-decoration: none; color: var(--suave); font-size: var(--fs-small); }
.subnav a span { font-family: var(--mono); font-size: 11px; color: var(--suave); }
.subnav a:hover { color: var(--tinta); }
.subnav a.on { background: var(--lavanda); color: var(--roxo); font-weight: 700; box-shadow: inset 2px 0 0 var(--roxo); }
.subnav a.on span { color: var(--roxo); }
.trocar { display: flex; gap: 6px 26px; flex-wrap: wrap; margin-bottom: 30px; padding-right: clamp(0px, 20vw, 300px); }
.trocar a { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--suave); text-decoration: none; padding-bottom: 3px; border-bottom: 2px solid transparent; }
.trocar a.on { color: var(--roxo); border-bottom-color: var(--verde); }

/* Lista + detalhe (12 pontos, áreas) */
.mestre { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 40px; align-items: start; }
@media (max-width: 1000px) { .mestre { grid-template-columns: 1fr; } }
.lista { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--fio); }
.lista button { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--fio); padding: 13px 10px; cursor: pointer; font-size: var(--fs-small); }
.lista button:hover { background: var(--tom); }
.lista button.on { background: var(--lavanda); box-shadow: inset 0 2px 0 var(--verde); }
.lista button.on b { color: var(--roxo); }
.lista .n { font-family: var(--mono); color: var(--suave); font-size: 11px; }
.lista b { font-weight: 700; }
.lista .lado { font-size: var(--fs-caption); color: var(--suave); white-space: nowrap; }
.detalhe { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); border-top: 2px solid var(--roxo); padding-top: 22px; display: grid; gap: 18px; }
.detalhe .big-n { font-size: var(--fs-h1); font-weight: 300; color: var(--roxo); line-height: 1; font-variant-numeric: tabular-nums; }
.detalhe h3 { font-size: var(--fs-h4); }
.detalhe .bloco { display: grid; gap: 6px; padding-top: 14px; border-top: 1px solid var(--fio); }
.detalhe p { font-size: var(--fs-small); line-height: 1.75; }
.ligas { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.ligas a, .ligas span { font-size: var(--fs-small); font-weight: 700; text-decoration: none; }
.ligas a::after { content: " →"; }
.crit { margin: 0; padding: 0; list-style: none; display: grid; }
.crit li { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; padding: 8px 0; border-top: 1px solid var(--fio); font-size: var(--fs-small); }
.crit li .n { font-family: var(--mono); font-size: 11px; color: var(--suave); }
.crit li .r { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--verde-texto); }
details.filtro { border-top: 1px solid var(--fio); border-bottom: 1px solid var(--fio); padding: 16px 0; margin-bottom: 30px; }
details.filtro summary { cursor: pointer; font-weight: 700; font-size: var(--fs-small); color: var(--roxo); }
.testes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px; margin-top: 18px; }
@media (max-width: 900px) { .testes { grid-template-columns: 1fr 1fr; } }
.testes div { border-top: 2px solid var(--verde); padding-top: 10px; display: grid; gap: 4px; font-size: var(--fs-small); }
.testes b { font-weight: 700; }

/* Processo */
/* Passo a passo: mapa em raias + detalhe */
.m-auto { --m: var(--verde); } .m-parcial { --m: #9b84c4; } .m-manual { --m: var(--roxo); }
.pp-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 2px solid var(--verde); margin-bottom: 22px; }
.pp-kpis > div { display: grid; gap: 4px; padding: 14px 18px 14px 0; }
.pp-kpis > div + div { padding-left: 18px; border-left: 1px solid var(--fio); }
.pp-kpis b { font-size: var(--fs-h3); font-weight: 500; color: var(--roxo); font-variant-numeric: tabular-nums; line-height: 1.1; }
@media (max-width: 760px) { .pp-kpis { grid-template-columns: 1fr 1fr; } .pp-kpis > div:nth-child(3) { border-left: 0; padding-left: 0; } .pp-kpis > div:nth-child(n+3) { border-top: 1px solid var(--fio); } }
.pp-ctrl { display: flex; flex-wrap: wrap; gap: 14px 40px; margin-bottom: 14px; }
.pp-ctrl > div { display: grid; gap: 8px; }
.pp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pp-chips button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--fio-forte); background: #fff; padding: 6px 12px; font-size: var(--fs-small); cursor: pointer; }
.pp-chips button span { font-family: var(--mono); font-size: 11px; color: var(--suave); }
.pp-chips button:hover { border-color: var(--roxo); }
.pp-chips button.on { background: var(--lavanda); border-color: var(--roxo); color: var(--roxo); font-weight: 700; }
.pp-chips button:disabled { opacity: .4; cursor: default; }
.pp-chips i, .pp-legenda i { width: 10px; height: 10px; background: var(--m); display: inline-block; }
.pp-nota { margin: 0 0 12px; color: var(--suave); }
.pp-mapa { overflow-x: auto; border-top: 1px solid var(--fio); border-bottom: 1px solid var(--fio); outline: none; }
.pp-grade { display: grid; --rotulo: 128px; }
@media (max-width: 600px) { .pp-grade { --rotulo: 96px; } }
.pp-canto { position: sticky; left: 0; background: #fff; z-index: 2; }
.pp-fase { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--roxo); padding: 10px 8px 6px; border-left: 1px solid var(--fio-forte); }
.pp-fase span { color: var(--suave); margin-right: 8px; }
.pp-no { position: relative; display: grid; align-content: start; gap: 4px; text-align: left; background: #fff; border: 0; border-top: 4px solid var(--m); padding: 10px 8px 12px; cursor: pointer; min-height: 84px; font-size: 13px; line-height: 1.3; }
.pp-no .n { font-family: var(--mono); font-size: 11px; color: var(--suave); }
.pp-no b { font-weight: 700; }
.pp-no:hover { background: var(--tom); }
.pp-no.on { background: var(--lavanda); box-shadow: inset 0 0 0 2px var(--roxo); }
.pp-no.on b { color: var(--roxo); }
.pp-con { position: absolute; top: 8px; right: 8px; color: var(--verde-texto); font-size: 10px; }
.pp-legenda .pp-con { position: static; }
.pp-raia { position: sticky; left: 0; z-index: 1; background: #fff; display: grid; align-content: center; gap: 1px; padding: 8px 12px 8px 0; min-width: 0; border-top: 1px solid var(--fio); font-size: var(--fs-small); box-shadow: 1px 0 0 var(--fio); }
.pp-raia .cap { font-size: 11px; }
.pp-cel { border: 0; border-top: 1px solid var(--fio); background: none; padding: 8px 4px; cursor: pointer; display: grid; align-items: center; min-height: 46px; }
.pp-cel:hover, .pp-cel.on { background: var(--tom); }
.pp-cel .bar { display: block; background: var(--m); color: #fff; font-family: var(--mono); font-size: 10px; letter-spacing: .04em; padding: 5px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pp-cel .bar.m-parcial { color: #fff; }
.apaga { opacity: .22; }
.pp-legenda { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 10px 0 30px; }
.pp-legenda span { display: inline-flex; align-items: center; gap: 6px; }
.pp-det { border-top: 2px solid var(--roxo); padding-top: 22px; display: grid; gap: 18px; scroll-margin-top: 110px; }
.pp-det-cab { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.pp-det-cab .big-n { font-size: var(--fs-h1); font-weight: 300; color: var(--roxo); line-height: 1; font-variant-numeric: tabular-nums; }
.pp-det-cab h3 { font-size: var(--fs-h3); font-weight: 300; margin-top: 4px; }
.pp-tag { color: var(--tinta); } .pp-tag::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--m); margin-right: 6px; }
.pp-nav { display: flex; align-items: center; gap: 10px; }
.pp-nav button { width: 40px; height: 40px; border: 1px solid var(--fio-forte); background: #fff; cursor: pointer; font-size: 18px; color: var(--roxo); }
.pp-nav button:hover:not(:disabled) { background: var(--lavanda); border-color: var(--roxo); }
.pp-nav button:disabled { opacity: .35; cursor: default; }
.pp-faz { font-size: var(--fs-lead); line-height: 1.6; max-width: 70ch; margin: 0; }
.pp-saida { display: grid; gap: 4px; background: var(--tom); border-left: 3px solid var(--verde); padding: 12px 16px; }
.pp-blocos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px 32px; padding-top: 14px; border-top: 1px solid var(--fio); }
.pp-prox { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: baseline; text-align: left; width: 100%; background: none; border: 0; border-top: 1px solid var(--fio); border-bottom: 2px solid var(--fio-forte); padding: 14px 0; cursor: pointer; color: var(--roxo); text-decoration: none; font-size: var(--fs-small); }
.pp-prox:hover { border-bottom-color: var(--verde); }
.pp-tudo { margin-top: 34px; }
.pp-tudo summary { cursor: pointer; font-weight: 700; font-size: var(--fs-small); color: var(--roxo); margin-bottom: 12px; }
.pp-tudo tr[data-pp] { cursor: pointer; } .pp-tudo tr[data-pp]:hover td { background: var(--tom); } .pp-tudo tr.on td { background: var(--lavanda); }
@media (max-width: 600px) { .pp-det-cab { grid-template-columns: auto minmax(0, 1fr); } .pp-nav { grid-column: 1 / -1; } .pp-raia { min-width: 0; } }
.ok-franq { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--verde-texto); }
table.t td.gargalo { background: var(--lavanda); color: var(--roxo); font-weight: 700; }
.grade4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 24px; }
@media (max-width: 760px) { .grade4 { grid-template-columns: 1fr 1fr; } }
.grade4 div { display: grid; gap: 2px; font-size: var(--fs-small); }
.grade4 .cap { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }

/* Escopo */
.tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 900px) { .tres { grid-template-columns: 1fr; } }
.tres > div { display: grid; gap: 10px; align-content: start; }
.setas { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: var(--fs-small); }
.setas li { display: grid; grid-template-columns: 18px 1fr; }
.setas li::before { content: "→"; color: var(--verde-texto); }

/* Tabelas */
.rolar { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: var(--fs-small); }
table.t th { text-align: left; font-family: var(--mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .2em; color: var(--roxo); padding: 0 14px 10px 0; border-bottom: 1px solid var(--fio-forte); white-space: nowrap; }
table.t td { padding: 12px 14px 12px 0; border-bottom: 1px solid var(--fio); vertical-align: top; }
table.t td.r, table.t th.r { text-align: right; }

<script>
/* Motor do Método de Diagnóstico Atom: nota, urgências, plano, quanto vale e proposta.
   Fonte única para os dois modos de uso:
   - modo 2 (manual): a página metodo-diagnostico.html carrega este arquivo depois de dados.js;
   - modo 1 (automático, Pipedrive → n8n): o n8n usa a mesma lógica (n8n/code/metodo_motor.js, gerado por npm run metodo:motor).
   Depende só dos dados de dados.js (AREAS, TIPOS, PLANEJAMENTO_PADRAO). Sem acesso a rede, sem data implícita. */
const MOTOR = (function () {
  const ORDEM = { ven: 0, ges: 1, mkt: 2 };
  const rapido = c => c.startsWith("!");
  const txt = c => c.replace(/^!/, "");
  const tipoDe = id => TIPOS.find(t => t.id === id);

  // Régua: 5 critérios × 2 pontos por área.
  const nota = (r, a) => (r.marc[a] || []).filter(Boolean).length * 2;
  const faixa = n => n <= 4 ? "Perdendo cliente" : n <= 7 ? "Pode melhorar" : "Funciona";

  function areasDe(tipos) {
    const set = new Set(); tipos.forEach(id => (tipoDe(id)?.areas || []).forEach(a => set.add(a)));
    return Object.keys(AREAS).filter(a => set.has(a));
  }

  // r = { tipos, marc: {area: [bool×5]}, dentro: {area: bool}, valor: {procura, contato, fecha, ticket} }
  function diagnostico(r) {
    const areas = areasDe(r.tipos), med = areas.filter(a => r.dentro[a] !== false);
    const media = l => l.length ? Math.round(l.reduce((s, a) => s + nota(r, a), 0) / l.length * 10) / 10 : 0;
    const porTipo = r.tipos.map(id => ({ id, n: media((tipoDe(id)?.areas || []).filter(a => r.dentro[a] !== false)) }));
    const urg = med.slice().sort((x, y) => nota(r, x) - nota(r, y) || ORDEM[AREAS[x].g] - ORDEM[AREAS[y].g]).slice(0, 3);
    const plano = { hoje: [], d90: [], m6: [] };
    med.forEach(a => AREAS[a].c.forEach((c, i) => {
      if ((r.marc[a] || [])[i]) return;
      const it = { area: a, texto: `${AREAS[a].nome}: ${txt(c).charAt(0).toLowerCase() + txt(c).slice(1)}` };
      if (rapido(c)) plano.hoje.push(it); else if (urg.includes(a) || AREAS[a].h === "90") plano.d90.push(it); else plano.m6.push(it);
    }));
    const v = r.valor || {}, contatos = Math.round((v.procura || 0) * (v.contato || 0) / 100), clientes = Math.round(contatos * (v.fecha || 0) / 100);
    const geral = media(med);
    return { areas, med, notas: Object.fromEntries(med.map(a => [a, nota(r, a)])), geral, faixa: faixa(geral), porTipo, urg, plano,
      valor: { contatos, clientes, total: clientes * (v.ticket || 0) }, temValor: r.tipos.some(id => tipoDe(id)?.valor) };
  }

  // Ofertas que a proposta leva, por diagnóstico. O Diagnóstico Total (produto pago) leva Geral + Site.
  const OFERTAS_DO_TIPO = { site: ["site"], seo: ["seo"], geral: ["geral"], atendimento: ["atendimento"], completo: ["geral", "site"] };

  // plan: PLANEJAMENTO_PADRAO (ou o salvo pela equipe). hojeISO: data da proposta (AAAA-MM-DD), obrigatória.
  function proposta(r, d, plan, hojeISO) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(hojeISO || "")) throw new Error("proposta: informe a data (AAAA-MM-DD)");
    const ids = [...new Set(r.tipos.flatMap(id => OFERTAS_DO_TIPO[id] || []))];
    const V = plan.vendas || {}, pend = [];
    const ofertas = ids.map(id => {
      const t = tipoDe(id), preco = Number(V[id]?.preco) || 0, parcelas = Math.max(1, Number(V[id]?.parcelas) || 1);
      if (!preco) pend.push(`Preço de venda de "${t.nome}" não definido (Metas e custos → Receita e lucro).`);
      const doTipo = new Set(t.areas);
      const resolve = d.urg.filter(a => doTipo.has(a)).map(a => ({ area: a, nome: AREAS[a].nome, nota: d.notas[a], solucao: AREAS[a].sol }));
      const itens = [...d.plano.hoje, ...d.plano.d90].filter(x => doTipo.has(x.area)).map(x => x.texto);
      return { id, nome: t.oferta, diagnostico: t.nome, preco, parcelas, mensal: Math.round(preco / parcelas * 100) / 100,
        condicao: parcelas > 1 ? `${parcelas} parcelas mensais de ${brl(preco / parcelas)}` : "à vista", resolve, entregas: itens.slice(0, 8) };
    });
    const total = ofertas.reduce((s, o) => s + o.preco, 0);
    const validade = somaDias(hojeISO, plan.validadePropostaDias || 10);
    return {
      data: hojeISO, validade, ofertas, total, pendencias: pend, pronta: pend.length === 0 && ofertas.length > 0,
      porque: d.urg.map(a => ({ area: a, nome: AREAS[a].nome, nota: d.notas[a], faixa: faixa(d.notas[a]) })),
      valorEmJogo: d.temValor ? d.valor.total : null,
      proximos: ["Aceite pela página da proposta", "Contrato para assinatura (Autentique)", "Cobrança (Asaas)", "Início do projeto"]
    };
  }

  // ---------- Leitura das coletas (Apify) e marcação automática dos critérios ----------
  // Funções puras: recebem o que a Apify devolveu e as datas explícitas. Usadas pela página (botão "Coletar no Apify") e pelo n8n.
  const normal = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  const dominio = u => String(u || "").toLowerCase().replace(/^https?:\/\//, "").replace(/^www\./, "").split(/[/?#]/)[0];
  const dataBR = iso => { const d = String(iso || "").slice(0, 10).split("-"); return d.length === 3 ? `${d[2]}/${d[1]}/${d[0]}` : ""; };
  const n0 = v => Math.round(Number(v) || 0).toLocaleString("pt-BR");
  const n1 = v => Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const diasEntre = (iso, agoraISO) => iso ? Math.floor((new Date(agoraISO).getTime() - new Date(iso).getTime()) / 864e5) : null;

  function acharEmpresa(empresa, itens) {
    const d = dominio(empresa.site), nome = normal(empresa.nome).replace(/\b(ltda|me|eireli|sa)\b/g, "").trim();
    let i = d ? itens.findIndex(x => dominio(x.website) && dominio(x.website) === d) : -1;
    if (i < 0 && nome.length > 2) i = itens.findIndex(x => normal(x.title).includes(nome) || nome.includes(normal(x.title)));
    return i;
  }
  // itens: Google Maps Scraper (rank, title, totalScore, reviewsCount, categoryName, imagesCount, claimThisBusiness, phone, website, url)
  function lerMapa(itensBrutos, empresa, busca, cidade, dataISO) {
    const itens = (itensBrutos || []).filter(x => x && x.title).sort((a, b) => (a.rank ?? 999) - (b.rank ?? 999));
    return { fonte: "Apify · Google Maps Scraper", busca, cidade, data: dataISO, itens, alvo: acharEmpresa(empresa, itens), custoUSD: itens.length * 0.003 };
  }
  // pags: Website Content Crawler (url, metadata.title, metadata.description, metadata.jsonLd); homeHtml: HTML da página inicial
  function lerSite(pags, homeHtml, ctx, url, dataISO) {
    pags = pags || [];
    const html = String(homeHtml || ""), low = html.toLowerCase();
    const tipos = [...new Set(pags.flatMap(p => (JSON.stringify(p["metadata.jsonLd"] || (p.metadata || {}).jsonLd || "").match(/"@type":"([A-Za-z]+)"/g) || []).map(m => m.slice(9, -1))))];
    const texto = normal(html.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/gi, " ").replace(/<[^>]+>/g, " ")).slice(0, 4000);
    const h1 = ((html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i) || [])[1] || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
    const insta = ((html.match(/instagram\.com\/([A-Za-z0-9_.]{2,30})/i) || [])[1] || "").replace(/^(p|reel|explore|accounts)$/i, "");
    const cidade = normal(String(ctx.cidade || "").split("/")[0]), seg = normal(ctx.segmento || "").split(" ")[0] || "";
    const tit = p => p["metadata.title"] ?? (p.metadata || {}).title, desc = p => p["metadata.description"] ?? (p.metadata || {}).description;
    const metaDesc = ((html.match(/<meta[^>]+name=["']description["'][^>]*content=["']([^"']{10,300})/i) || [])[1] || "").trim();
    return {
      fonte: "Apify · Website Content Crawler", url, data: dataISO,
      paginas: pags.length, semDescricao: pags.filter(p => !desc(p)).length, semTitulo: pags.filter(p => !tit(p)).length,
      titulo: (pags[0] && tit(pags[0])) || "", h1, descricao: metaDesc || (pags[0] && desc(pags[0])) || "", tipos,
      whatsapp: /wa\.me\/|api\.whatsapp\.com|whatsapp:\/\//.test(low), tel: /href=["']tel:/.test(low),
      ga4: /gtag\/js\?id=g-|googletagmanager\.com\/gtag/.test(low), gtm: /googletagmanager\.com\/gtm\.js|gtm-[a-z0-9]{4,}/.test(low), pixel: /connect\.facebook\.net|fbq\(/.test(low),
      cms: /wp-content|wp-includes/.test(low) ? "WordPress" : /wix\.com|wixstatic/.test(low) ? "Wix" : /cdn\.shopify/.test(low) ? "Shopify" : /nuvemshop|lojanuvem/.test(low) ? "Nuvemshop" : "",
      citaCidade: cidade ? texto.includes(cidade) : null, citaSegmento: seg ? texto.includes(seg) : null, instagram: insta
    };
  }
  // p: Instagram Profile Scraper (username, biography, externalUrl, followersCount, postsCount, isBusinessAccount, latestPosts…)
  function lerInsta(p, dataISO) {
    if (!p || p.error || !p.username) return null;
    const posts = (p.latestPosts || []).filter(x => !x.isPinned).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    const em30 = posts.filter(x => diasEntre(x.timestamp, dataISO) <= 30);
    const eng = posts.length && p.followersCount ? posts.slice(0, 12).reduce((s, x) => s + (x.likesCount || 0) + (x.commentsCount || 0), 0) / Math.min(12, posts.length) / p.followersCount * 100 : null;
    const bio = `${p.biography || ""} ${p.externalUrl || ""}`.toLowerCase();
    return { fonte: "Apify · Instagram Profile Scraper", usuario: p.username, data: dataISO, custoUSD: 0.0023,
      seguidores: p.followersCount, posts: p.postsCount, comercial: p.isBusinessAccount, categoria: p.businessCategoryName, privado: p.private,
      ultimoDias: posts[0] ? diasEntre(posts[0].timestamp, dataISO) : null, mes: em30.length, reelsMes: em30.filter(x => x.productType === "clips" || x.type === "Video").length,
      engajamento: eng, link: !!p.externalUrl, whatsappBio: /wa\.me|whatsapp|api\.whatsapp/.test(bio), bio: p.biography || "" };
  }
  // Marca os critérios que a coleta prova e escreve a evidência com fonte e data. C = { mapa, site, insta }.
  function aplicarColetas(r, C) {
    const areas = areasDe(r.tipos), tem = a => areas.includes(a);
    r.evid = r.evid || {};
    const m = C.mapa;
    if (m && m.alvo >= 0) {
      const it = m.itens[m.alvo], pos = m.alvo + 1, top3 = m.itens.slice(0, 3);
      const maxAv = Math.max(0, ...top3.map(x => x.reviewsCount || 0)), lider = top3.find(x => (x.reviewsCount || 0) === maxAv) || top3[0];
      const f = `Apify · Google Maps, busca "${m.busca}" em ${m.cidade}, ${dataBR(m.data)}`;
      if (tem("map")) { r.marc.map[0] = pos <= 3; r.marc.map[1] = it.claimThisBusiness === false; r.marc.map[3] = (it.imagesCount || 0) >= 50; r.dentro.map = true;
        r.evid.map = `${f}: ${pos}º de ${m.itens.length}; perfil ${it.claimThisBusiness ? "não reivindicado" : "reivindicado"}; ${it.imagesCount ?? 0} fotos; categoria "${it.categoryName || "—"}"; telefone ${it.phone || "não informado"}. Conferir horário e categoria.`; }
      if (tem("ava")) { r.marc.ava[0] = (it.totalScore || 0) >= 4.5; r.marc.ava[1] = maxAv ? (it.reviewsCount || 0) >= maxAv / 2 : false; r.dentro.ava = true;
        r.evid.ava = `${f}: nota ${it.totalScore ?? "—"} com ${it.reviewsCount ?? 0} avaliações. Maior volume do top 3: ${lider ? `${lider.title}, ${lider.totalScore ?? "—"} com ${lider.reviewsCount ?? 0}` : "—"}.`; }
    }
    const s = C.site;
    if (s) {
      const f = `Apify · leitura de ${s.paginas} páginas de ${dominio(s.url)}, ${dataBR(s.data)}`;
      if (tem("sit")) { r.marc.sit[1] = !!(s.citaCidade && s.citaSegmento); r.marc.sit[2] = s.whatsapp; r.marc.sit[3] = s.tel; r.dentro.sit = true;
        r.evid.sit = `${f}: título "${s.titulo || "—"}"; H1 "${s.h1 || "sem H1"}"; ${s.citaSegmento ? "cita" : "não cita"} o segmento e ${s.citaCidade ? "cita" : "não cita"} a cidade; WhatsApp ${s.whatsapp ? "com link" : "sem link"}; telefone ${s.tel ? "clicável" : "não clicável"}. Velocidade: medir no PageSpeed.`; }
      if (tem("est")) { r.marc.est[2] = s.paginas > 0 && s.semDescricao === 0 && s.semTitulo === 0; r.marc.est[3] = s.tipos.some(x => /LocalBusiness|Organization|Dentist|MedicalBusiness|Store|ProfessionalService|Service/.test(x)); r.dentro.est = true;
        r.evid.est = `${f}: ${s.semDescricao} de ${s.paginas} páginas sem descrição; dados estruturados: ${s.tipos.length ? s.tipos.join(", ") : "nenhum"}.`; }
      if (tem("conv")) { r.marc.conv[3] = s.ga4 || s.gtm; r.dentro.conv = true;
        r.evid.conv = `${f}: ${[s.ga4 && "GA4", s.gtm && "Tag Manager", s.pixel && "Meta Pixel"].filter(Boolean).join(", ") || "nenhuma tag de medição"} instalado(s). Conferir se as conversões estão configuradas.`; }
    }
    const g = C.insta;
    if (g && tem("ins")) {
      r.marc.ins[0] = g.ultimoDias != null && g.ultimoDias <= 7; r.marc.ins[1] = g.mes >= 8; r.marc.ins[2] = g.reelsMes > 0; r.marc.ins[3] = g.whatsappBio; r.marc.ins[4] = g.link; r.dentro.ins = true;
      r.evid.ins = `Apify · Instagram @${g.usuario}, ${dataBR(g.data)}: ${n0(g.seguidores || 0)} seguidores; último post há ${g.ultimoDias ?? "—"} dias; ${g.mes} posts e ${g.reelsMes} Reels em 30 dias; engajamento médio ${g.engajamento != null ? n1(g.engajamento) + "%" : "—"}; ${g.link ? "tem link na bio" : "sem link na bio"}${g.whatsappBio ? " e WhatsApp" : ""}.`;
    }
    return r;
  }

  // ---------- As 3 informações da abordagem (etapa 02 da Máquina Comercial) ----------
  // Uma sobre o negócio, uma sobre a reputação, uma oportunidade com número. Só entra o que a coleta provou; nada é inventado.
  function tresFatos(C, empresa) {
    const fatos = [], m = C.mapa, s = C.site, g = C.insta;
    const it = m && m.alvo >= 0 ? m.itens[m.alvo] : null;
    // 1. O negócio: o que a própria empresa diz que faz (H1 ou descrição do site), ou a categoria no Google.
    const frase = s && (s.h1 && s.h1.length >= 12 && s.h1.length <= 120 ? s.h1 : (s.descricao && s.descricao.length <= 160 ? s.descricao : ""));
    if (frase) fatos.push({ tipo: "negocio", texto: `No site, a ${empresa.nome} se apresenta assim: "${frase}".`, fonte: `${dominio(s.url)}, ${dataBR(s.data)}` });
    else if (it && it.categoryName) fatos.push({ tipo: "negocio", texto: `No Google, a ${empresa.nome} aparece como ${it.categoryName.toLowerCase()}${empresa.cidade ? " em " + empresa.cidade : ""}.`, fonte: `Google Maps, ${dataBR(m.data)}` });
    // 2. A reputação: nota e avaliações, comparadas ao maior volume do top 3.
    if (it && it.totalScore != null && it.reviewsCount != null) {
      const top3 = m.itens.slice(0, 3).filter(x => x !== it), lider = top3.sort((a, b) => (b.reviewsCount || 0) - (a.reviewsCount || 0))[0];
      const comp = !lider ? "" : (lider.reviewsCount || 0) > it.reviewsCount ? `; a com mais avaliações entre as primeiras da busca tem ${n0(lider.reviewsCount)}` : it.reviewsCount > (lider.reviewsCount || 0) ? `, mais do que qualquer uma das primeiras da busca` : "";
      fatos.push({ tipo: "reputacao", texto: `Nota ${n1(it.totalScore)} no Google com ${n0(it.reviewsCount)} avaliações${comp}.`, fonte: `Google Maps, busca "${m.busca}", ${dataBR(m.data)}` });
    }
    // 3. A oportunidade: posição no mapa para a busca principal; sem mapa, um ponto do site ou do Instagram.
    if (m && m.itens.length) {
      const pos = m.alvo >= 0 ? m.alvo + 1 : null;
      fatos.push({ tipo: "oportunidade", texto: pos ? (pos <= 3 ? `Para "${m.busca}" em ${m.cidade}, a ${empresa.nome} já está entre as 3 primeiras do mapa.` : `Para "${m.busca}" em ${m.cidade}, a ${empresa.nome} aparece em ${pos}º no mapa do Google.`)
        : `Para "${m.busca}" em ${m.cidade}, a ${empresa.nome} não aparece entre os ${m.itens.length} primeiros do mapa.`, fonte: `Google Maps, ${dataBR(m.data)}` });
    } else if (s && !s.whatsapp) fatos.push({ tipo: "oportunidade", texto: `O site não tem um botão de WhatsApp: quem chega pelo celular precisa procurar como falar com vocês.`, fonte: `${dominio(s.url)}, ${dataBR(s.data)}` });
    else if (g && g.ultimoDias != null && g.ultimoDias > 30) fatos.push({ tipo: "oportunidade", texto: `O último post no Instagram (@${g.usuario}) foi há ${g.ultimoDias} dias.`, fonte: `Instagram, ${dataBR(g.data)}` });
    return fatos.slice(0, 3);
  }
  // Primeira mensagem (D1): as informações e a oferta do diagnóstico gratuito. Nunca leva preço.
  function mensagemAbordagem(fatos, empresa, consultor) {
    const corpo = fatos.map(f => f.texto).join(" ");
    const txt = `Olá! Sou ${consultor || "o Thiago"}, da Atom. Olhei a presença digital da ${empresa.nome}. ${corpo} Preparei um diagnóstico gratuito mostrando o que muda o jogo para vocês. Posso te enviar?`;
    if (/R\$|\breais\b|\bpre[çc]o\b|\bvalor(es)?\b/i.test(txt)) throw new Error("mensagemAbordagem: texto com preço");
    return txt;
  }

  const brl = v => Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: 0, maximumFractionDigits: 2 });
  function somaDias(iso, n) { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }

  return { ORDEM, rapido, txt, nota, faixa, areasDe, diagnostico, proposta, OFERTAS_DO_TIPO, brl, normal, dominio, dataBR, acharEmpresa, lerMapa, lerSite, lerInsta, aplicarColetas, tresFatos, mensagemAbordagem };
})();

<script>
/* ======================= UTILIDADES ======================= */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const ST = { ok: ["ok", "Definido"], disc: ["disc", "Em discussão"], adef: ["", "A definir"] };

/* ======================= ESTADO ======================= */

const precoItem = (f, it) => plan.precos[f.id]?.[it.id] ?? it.preco;

const emBRL = (v, moeda) => v * (moeda === "EUR" ? plan.cambioEUR : plan.cambio);
const naFranquia = (f, it) => f.modo !== "uso" || !!it.franquia; // consumo coberto por mensalidade ou cota grátis já existente
function custoConsumo(cons) { // por diagnóstico, em BRL: total = caixa (sai do bolso a cada diagnóstico); franq = valor equivalente consumido das franquias já pagas
  const linhas = FERRAMENTAS.map(f => {
    let caixa = 0, franq = 0, faltando = false, usaFranq = false;
    f.itens.forEach(it => { const q = cons[f.id]?.[it.id] || 0; if (!q) return; const p = precoItem(f, it);
      if (naFranquia(f, it)) { usaFranq = true; if (p != null) franq += q * p; } else if (p == null) faltando = true; else caixa += q * p; });
    return { f, usd: caixa, brl: emBRL(caixa, f.moeda), franq: emBRL(franq, f.moeda), usaFranq, faltando };

}
function consumoEfetivo(id) { // prospecção: a parte de mercado do Semrush (segmento + cidade) é consultada uma vez e reaproveitada
  const c = JSON.parse(JSON.stringify(CONSUMO[id] || {}));
  if (tipo(id)?.finalidade === "prospeccao" && c.semrush && plan.semrushProspeccao === "seo" && id !== "seo" && id !== "site") c.semrush.unidades = 0;
  if (tipo(id)?.finalidade === "prospeccao" && id !== "site" && c.semrush && plan.reusoMercado > 1) { // no Site, o Semrush lê o domínio do cliente: não há parte de mercado a reaproveitar
    const parte = Math.min(100, Math.max(0, plan.parteMercadoSemrush)) / 100;
    c.semrush.unidades = c.semrush.unidades * ((1 - parte) + parte / plan.reusoMercado);

}
function consumoUniao(ids) { // coleta compartilhada: maior consumo de cada item entre os diagnósticos escolhidos
  const out = {};
  ids.forEach(id => { const c = consumoEfetivo(id); for (const f in c) for (const u in c[f]) { out[f] = out[f] || {}; out[f][u] = Math.max(out[f][u] || 0, c[f][u]); } });

function funilMeta() {
  const linhas = TIPOS.map(t => {

    if (t.finalidade === "produto") return { t, meta, vendasMes, reunioes: 0, abordagens: 0, diags: vendasMes };

function totais(linhas) {

  return { linhas, vendasMes: tot("vendasMes", "prospeccao"), reunioes: tot("reunioes"), abordagens: tot("abordagens"), diags: tot("diags"), produto: linhas.find(l => l.t.finalidade === "produto") };

function capacidade() { // reuniões por dia distribuídas na proporção das metas
  const M = funilMeta(), cap = (Number(plan.reunioesDia) || 0) * plan.diasUteis;

function custoMensal() {
  const F = funil();
  const uso = {}; // uso[f][item] no mês
  const soma = (cons, k) => { for (const f in cons) for (const u in cons[f]) { uso[f] = uso[f] || {}; uso[f][u] = (uso[f][u] || 0) + cons[f][u] * k; } };

    return { f, uso: uso[f.id] || {}, mensal: m, variavel, total, brl: emBRL(total, f.moeda), semPreco };

function franquias(C) { // capacidade mensal de cada franquia, em diagnósticos
  const linhas = [];
  FERRAMENTAS.forEach(f => {
    if (f.modo === "credito") {
      const cap = mensalDe(f), usd = id => f.itens.reduce((s, it) => s + (consumoEfetivo(id)[f.id]?.[it.id] || 0) * (precoItem(f, it) || 0), 0);
      const usoMes = C.linhas.find(l => l.f.id === f.id)?.variavel || 0;
      if (cap > 0) linhas.push({ f, rot: `US$ ${n0(cap)} de crédito`, cap, por: usd, usoMes, fmt: v => "US$ " + v.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) });
      return;
    }
    if (f.modo === "franquia" && !mensalDe(f)) return; // plano não contratado
    f.itens.forEach(it => { if (!it.franquia) return;
      linhas.push({ f, it, rot: `${n0(it.franquia)} ${it.rot}${f.modo === "uso" ? " grátis" : ""}`, cap: it.franquia, por: id => consumoEfetivo(id)[f.id]?.[it.id] || 0, usoMes: C.linhas.find(l => l.f.id === f.id)?.uso[it.id] || 0, fmt: v => n0(v) });
    });
  });

  return { linhas, porTipo, fator, gargaloMix: isFinite(fator) ? linhas[kg] : null, pagosMix: isFinite(fator) ? C.F.diags * Math.min(1, fator) : C.F.diags };

function receita(C) { // caixa, impostos e lucro mês a mês no cenário escolhido

  <section class="secao"><div class="cab-linha"><div class="cab"><h2>Modelos e <b>metas.</b></h2></div><span class="over" style="color:var(--suave)">Prazo das metas · próximos ${plan.meses} meses</span></div>
    <div class="colunas">${TIPOS.filter(t => t.finalidade === "prospeccao").map((t, i) => `<div class="col ${i === 0 ? "p1" : ""}">
      <div class="linha-top"><span class="cap num">${pad(i)}</span><span class="over" style="color:${i === 0 ? "var(--roxo)" : "var(--suave)"}">${esc(t.prioridade)}</span></div>
      <h3>${esc(t.nome)}</h3><span class="small suave">${esc(t.sub)}</span>
      <div class="grande">${t.meta ? n0(plan.metas[t.id]) : "—"}<small>${esc(t.unidade)}</small></div>
      <p class="small suave">${esc(t.desc)}</p>
      <dl class="dl"><div><dt>Ritmo</dt><dd>${plan.metas[t.id] ? n0(plan.metas[t.id] / plan.meses) + " / mês" : "meta a definir"}</dd></div><div><dt>Áreas</dt><dd>${t.areas.length}</dd></div><div><dt>Etapas</dt><dd>${t.processo.length}</dd></div><div><dt>Situação</dt><dd><span class="ponto ${ST[t.st][0]}">${ST[t.st][1]}</span></dd></div></dl>
      <a class="ir" href="#${t.id}-metodo">Abrir o diagnóstico <span>→</span></a></div>`).join("")}</div>
    <p class="cap" style="margin-top:18px">Diagnósticos de prospecção: baratos, feitos em cada empresa abordada. Metas informadas por Thiago; o ritmo mensal é uma média.</p>
    ${produtoHTML()}<p class="fecho">O diagnóstico é a porta de entrada. A proposta nasce dele.</p></section>

  <section class="secao"><div class="cab-linha"><div class="cab"><span class="over">${plan.cenario === "capacidade" ? `Com ${n0(plan.reunioesDia)} reuniões por dia` : "Para bater as metas"}</span><h2>O tamanho <b>da operação</b></h2></div><a class="btn sec" href="#custos">Ver metas e custos →</a></div>
    <div class="colunas cartoes" style="--n:4">
      <div class="col verde"><span class="cap">Vendas por mês</span><span class="grande">${n0(F.vendasMes)}</span><span class="small suave">${plan.cenario === "capacidade" ? `${n0(funil().vendasMes * plan.meses)} em ${plan.meses} meses` : "somando as ofertas"}</span></div>
      <div class="col verde"><span class="cap">Reuniões por mês</span><span class="grande">${n0(F.reunioes)}</span><span class="small suave">${plan.cenario === "capacidade" ? `${n0(plan.reunioesDia)} por dia útil` : `com ${n1(plan.taxaFechamento)}% de fechamento`}</span></div>
      <div class="col verde"><span class="cap">Empresas abordadas por mês</span><span class="grande">${n0(F.abordagens)}</span><span class="small suave">com ${n1(plan.taxaReuniao)}% virando reunião</span></div>
      <div class="col destaque"><span class="over">Por dia útil</span><span class="grande">${n0(F.abordagens / plan.diasUteis)}</span><span class="small suave">abordagens com diagnóstico de prospecção</span></div>
    </div>
    <p class="cap" style="margin-top:18px">Taxas do Plano Mestre (hipóteses ainda não comprovadas). Ajuste em Metas e custos.</p><p class="fecho">${plan.cenario === "capacidade" ? (() => { const K = capacidade(); return `Nesse ritmo: ${n0(K.vendasMes * plan.meses)} vendas em ${plan.meses} meses, ${n0(K.vendasMes * plan.meses / (K.meta.vendasMes * plan.meses || 1) * 100)}% das metas. Detalhes em Metas e custos.`; })() : "A meta pede volume de abordagem. Sem diagnóstico de prospecção automático, não há equipe que dê conta."}</p></section>

  <section class="secao"><div class="cab"><span class="over">Como todo diagnóstico funciona</span><h2>Da coleta <b>à proposta.</b></h2></div>
    <div class="passos">
      <div><i></i><b>Coleta</b><p>Dados públicos automáticos e, quando o diagnóstico pede, cliente oculto e entrevista.</p></div>
      <div><i></i><b>Pontuação</b><p>5 critérios por área, 2 pontos cada, sempre com a evidência.</p></div>
      <div><i></i><b>Urgências</b><p>As três notas mais baixas que mais custam cliente.</p></div>
      <div><i></i><b>Quanto vale</b><p>Procura × contato × fechamento × ticket.</p></div>
      <div><i></i><b>Plano e proposta</b><p>Hoje e grátis, 90 dias e 6 meses. As urgências definem a proposta.</p></div>
    </div></section>

  <section class="secao" id="pipedrive"><div class="cab"><span class="over">Integração com o Pipedrive</span><h2>O Pipedrive decide <b>qual diagnóstico sai</b></h2><p class="lead">Ninguém escolhe o diagnóstico na mão. O negócio entra na etapa de diagnóstico, a regra lê os campos do negócio e o resultado volta para ele.</p></div>
    <div class="regra-pd">
      <div><span class="over">01 · Gatilho</span><b>O negócio chega na etapa</b>${PIPEDRIVE.gatilhos.map(([f, , e]) => `<span class="small">${esc(PIPEDRIVE.funis[f])} → <b>${esc(e)}</b></span>`).join("")}<span class="cap">ou "ATOM · Refazer diagnóstico" preenchido</span></div>
      <div><span class="over">02 · Regra</span><b>"ATOM · Oferta de interesse"</b>${Object.entries(PIPEDRIVE.oferta).map(([o, ids]) => `<span class="small">${esc(o)} → <b>${ids.map(id => esc(tipo(id).nome)).join(" + ")}</b></span>`).join("")}<span class="small">sem oferta → <b>${PIPEDRIVE.semOferta.map(id => esc(tipo(id).nome)).join(" + ")}</b></span><span class="small">1ª parcela paga → <b>Total</b></span></div>
      <div><span class="over">03 · Gera</span><b>Coleta, nota e plano</b><span class="small">Empresa, site (campo dominio), segmento (nicho) e cidade vêm do negócio e da organização. Coleta no Apify e no Semrush, critérios e revisão em Gerar.</span></div>
      <div><span class="over">04 · Volta ao negócio</span><b>Nota e campos ATOM</b><span class="small">Raio-x como nota no negócio.</span><span class="small">ATOM · Status, Data, Versão e Pendências do diagnóstico.</span><span class="cap">Botão "Enviar ao Pipedrive" no Resultado</span></div>
    </div>
    <p class="cap" style="margin-top:12px">Funis, etapas e campos lidos na conta do Pipedrive em 15/10/2026. O consultor pode mudar o diagnóstico escolhido pela regra; a mudança fica visível no negócio.</p>
    <div class="acoes" style="margin-top:18px"><a class="btn" href="#gerar">Gerar a partir de um negócio →</a></div></section>

  <section class="secao"><div class="cab"><span class="over">Régua Atom</span><h2>A mesma régua <b>para tudo.</b></h2><p class="lead">Cada área tem 5 critérios de 2 pontos. Nota geral é a média das áreas medidas.</p></div>${regua()}</section>

  <section class="secao"><div class="cab"><span class="over">Áreas × diagnósticos</span><h2>O que cada diagnóstico <b>mede</b></h2><p class="lead">Clique num ponto para abrir a área dentro do diagnóstico. Somar diagnósticos para o mesmo cliente une as áreas, sem repetir a coleta.</p></div>
    <div class="rolar"><table class="t matriz"><thead><tr><th>Área</th>${TIPOS.map(t => `<th class="c">${esc(t.nome)}</th>`).join("")}<th>Quem resolve na Atom</th></tr></thead><tbody>

function custoDoRascunho(r) {
  const est = custoConsumo(consumoUniao(r.tipos)).total, real = emBRL(custoColetas(r), "USD");
  return { est, real };
}
function realHTML() {
  if (!db) return `<div class="vazio"><span>Disponível quando a página é aberta logado no claude.ai.</span></div>`;
  if (!dbPronto) return `<div class="vazio"><span>Carregando…</span></div>`;
  if (!gerados.length) return `<div class="vazio"><b>Nenhum diagnóstico salvo ainda</b><span>O custo real aparece aqui a partir do primeiro diagnóstico salvo.</span></div>`;
  const grupos = {};
  gerados.forEach(g => { const k = (g.tipos || [g.tipo]).filter(Boolean).map(id => tipo(id)?.nome || id).join(" + ") || "—"; const x = grupos[k] = grupos[k] || { n: 0, est: 0, real: 0 }; x.n++; x.est += Number(g.custoEstimado) || 0; x.real += Number(g.custoReal) || 0; });
  const T = Object.values(grupos).reduce((a, x) => ({ n: a.n + x.n, est: a.est + x.est, real: a.real + x.real }), { n: 0, est: 0, real: 0 });
  return `<div class="rolar"><table class="t"><thead><tr><th>Diagnósticos</th><th class="r">Quantidade</th><th class="r">Custo estimado</th><th class="r">Custo real registrado</th><th class="r">Médio estimado</th></tr></thead><tbody>
    ${Object.entries(grupos).map(([k, x]) => `<tr><td><b>${esc(k)}</b></td><td class="r num">${x.n}</td><td class="r num">${brl(x.est, 2)}</td><td class="r num">${brl(x.real, 2)}</td><td class="r num">${brl(x.est / x.n, 2)}</td></tr>`).join("")}
    <tr class="total"><td>Total</td><td class="r num">${T.n}</td><td class="r num">${brl(T.est, 2)}</td><td class="r num">${brl(T.real, 2)}</td><td class="r num">${brl(T.est / T.n, 2)}</td></tr></tbody></table></div>
    <p class="cap" style="margin-top:12px">Custo real hoje cobre só as coletas do Apify feitas pela página (lugares × tarifa). As chamadas feitas pelo n8n entram aqui quando o fluxo gravar o próprio custo.</p>`;
}
